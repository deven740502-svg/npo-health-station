  <title>陽光工坊健康站 v1.0.0</title>
  <!--
    ============================================================================
    區塊地圖 — 這個檔案怎麼讀（寫給人，也寫給你的 AI）
    ============================================================================
    整套系統就這一個 index.html。程式碼切成一個一個有名字的區塊，每個區塊開頭長這樣：

        // ============================================================================
        // 【區塊名】一句話說明
        // ============================================================================

    在編輯器裡搜尋   // 【   就能逐一跳到每個區塊。
    下面的行號是寫這份地圖當下的位置，改過幾次就會漂掉；**以區塊名搜尋為準**。

    ── 要換成你們自己的樣子，先改這四處 ──
    L482   window.FIREBASE_CONFIG   你的 Firebase 專案設定六欄（YOUR_* 就是要填的地方）
    L490   var WORKSHOPS            登入頁用的單位清單（登入前就要顯示，所以獨立一份）
    L690   DEFAULT_WORKSHOPS        Firestore 讀不到單位清單時的備用值
    L908   const dbAppId            Firestore 路徑的命名空間；改這裡要同步改 firestore.rules

    ── 程式區塊 ──
    L787   【內建常用藥物資料庫】供新增夥伴時快速帶入使用
    L804   【業務常數】異常複測解鎖時間 — v4.3.5 統一為 11:00（原為 13:30 / 量測+60 分鐘）
    L868   【版本記錄】CHANGELOG — 版本號從此自動讀取，不再手動修改兩個地方
    L880   【Firebase 設定】共用 window.FIREBASE_CONFIG（定義於 head 的 vanilla script）
    L920   【資安】AES-GCM 256-bit 用戶端欄位加密工具
    L1049  【防護網】錯誤攔截器
    L1076  【輔助組件】
    L1173  【EditRecordsModal】量測記錄管理彈窗
    L1402  【Changelog Modal】版本記錄彈窗
    L1438  【TrashModal】服務對象垃圾桶（v4.3.11）— 軟刪除清單 + 還原 + 永久刪除
    L1550  【DeleteConfirmModal】打字確認姓名後才允許軟刪除（v4.3.11）
    L1602  【脈搏複測 Modal】服務對象使用血氧機進行複測量測
    L1760  【選藥視窗元件】新增/編輯服務對象時，從資料庫直接選藥
    L2009  【全域常數】集中管理所有魔術數字，方便日後調整
    L2017  【App 主程式】
  -->
  
  <!-- 載入 Tailwind CSS（Play CDN 鎖版本；Play CDN 無穩定 SRI，僅鎖版號避免 silent breaking change） -->

  <!-- 清松手寫體2 子集字型 -->
  <style>
    @font-face {
      font-family: 'JasonHandwriting2';

  <!-- 品牌色與全域字型 -->
  <style>
    :root {
      --brand: #E8750A;
      --brand-light: #FFF0E0;
      --brand-dark: #C45E00;
      --brand-gold: #F5B820;
      --brand-gold-light: #FEF9E7;
      --paper: #fefdfc;
      --charcoal: #25221e;
      --soft-gray: #d7d6d4;
      --subtle-ash: #6f6c69;
      --shadow-subtle: rgba(37, 34, 30, 0.05) 0px 1px 0px 0px, rgba(37, 34, 30, 0.04) 0px 2px 8px 0px;
      --shadow-card: rgba(37, 34, 30, 0.06) 0px 4px 16px -4px, rgba(37, 34, 30, 0.04) 0px 1px 0px 0px;
    }
    body, .font-sans { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif !important; }
    /* 學員列表頁 Header 品牌色覆寫 */
    .list-header-brand { background-color: var(--paper); border-bottom: 1px solid var(--soft-gray); }
    /* 進度條 */
    .progress-brand { background-color: var(--brand); }
    .progress-gold  { background-color: var(--brand-gold); }
    /* 學員卡片 */
    .patient-card {
      background: var(--paper);
      border-radius: 10px;
      border: 1px solid var(--soft-gray);
      box-shadow: var(--shadow-card);
      transition: box-shadow 0.18s ease, transform 0.18s ease;
      overflow: hidden;
    }
    .patient-card:hover:not(.patient-card--locked):not(.patient-card--leave) {
      box-shadow: 0 8px 24px -4px rgba(232, 117, 10, 0.18), 0 1px 0px rgba(37,34,30,0.04);
      transform: translateY(-2px);
    }
    .patient-card--retest {
      box-shadow: 0 0 0 3px var(--brand), var(--shadow-card);
      background: var(--brand-light);
    }
    .patient-card--locked {
      opacity: 0.72;
      transform: scale(0.97);
    }
    .patient-card--leave {
      filter: grayscale(0.35);
      opacity: 0.65;
    }
    /* 搜尋列 */
    .search-bar-wrap {
      background: white;
      border: 1.5px solid var(--soft-gray);
      border-radius: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      transition: border-color 0.15s;
    }
    .search-bar-wrap:focus-within {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(232, 117, 10, 0.12);
    }
    /* 早安橫幅 */
    .morning-banner {
      background: linear-gradient(135deg, var(--brand-light) 0%, var(--brand-gold-light) 100%);
      border: 1px solid var(--brand-muted, #F5D4B0);
      border-radius: 12px;
    }
    /* Header 按鈕微調 */
    .header-btn-brand {
      background: var(--brand-light);
      color: var(--brand-dark);
      border-radius: 15px;
      font-weight: 700;
      border: 1px solid var(--brand-muted, #F5D4B0);
      transition: background 0.15s, box-shadow 0.15s;
    }
    .header-btn-brand:hover {
      background: #FFD9B0;
      box-shadow: 0 2px 8px rgba(232,117,10,0.15);
    }
  </style>

  <!-- 列印專屬版面設定：A4橫向、強制色彩印出、防止圖表與表格斷行 -->
  <style>
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; font-weight: normal !important; }
      * { font-weight: normal !important; }
      .print\:hidden { display: none !important; }
      .print\:grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; display: grid !important; }
      .print\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; display: grid !important; }
      .print\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; display: grid !important; }
      .print\:col-span-3 { grid-column: span 3 / span 3 !important; }
      .print\:col-span-2 { grid-column: span 2 / span 2 !important; }
      .print\:flex-row { flex-direction: row !important; }
      .print\:space-x-6 > :not([hidden]) ~ :not([hidden]) { margin-left: 1.5rem !important; margin-top: 0 !important; }
      /* ── 換頁控制（核心修正） ── */
      /* 列印時讓整個報表區域撐滿頁面寬度，無任何多餘留白 */
      body > #root, .min-h-screen { width: 100% !important; max-width: none !important; }
      main { padding: 0 !important; margin: 0 !important; }
      .report-patient-block { display: block; page-break-inside: auto; break-inside: auto; padding: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; border-radius: 0 !important; background: white !important; width: 100% !important; }
      .report-patient-block + .report-patient-block .report-first-page { page-break-before: always !important; break-before: page !important; }
      .report-second-page { page-break-before: always !important; break-before: page !important; padding-top: 0 !important; }
      .report-first-page { padding: 0 !important; margin: 0 !important; }
      .report-med-block { page-break-inside: avoid; break-inside: avoid; }
      /* ── 藥卡列印：字型縮小讓內容完整顯示，同排卡片等高自動撐開 ── */
      .report-med-block .med-card { overflow: hidden; }
      .report-med-block .med-card .med-name {
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; font-size: 8.5pt !important; line-height: 1.3 !important;
      }
      .report-med-block .med-card .med-dosage { font-size: 7.5pt !important; line-height: 1.3 !important; }
      .report-med-block .med-card .med-indication,
      .report-med-block .med-card .med-sideeffects {
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; font-size: 7.5pt !important; line-height: 1.35 !important;
      }
      .print\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; display: grid !important; }
      .print\:grid-cols-\[2fr_3fr\] { grid-template-columns: 2fr 3fr !important; display: grid !important; }
      table { page-break-inside: auto; }
      tr { page-break-inside: avoid; page-break-after: auto; }
      .recharts-wrapper { max-width: 100% !important; overflow: hidden !important; }
      .recharts-surface { overflow: visible; }
      /* 表格：10pt 易讀字體，行距控制確保15列在右半欄放得下 */
      @page { size: A4 landscape; margin: 8mm; }
      tbody tr td { padding-top: 1.5px !important; padding-bottom: 1.5px !important; line-height: 1.3 !important; font-size: 10pt !important; }
      thead tr th { padding-top: 2px !important; padding-bottom: 2px !important; font-size: 10pt !important; line-height: 1.3 !important; }
      /* 確保表格不超出右半欄寬度 */
      .report-patient-block table { width: 100% !important; table-layout: fixed !important; }
      .report-patient-block table th,
      .report-patient-block table td { overflow: hidden; text-overflow: ellipsis; }
    }
  </style>

  <!-- 載入 Babel 以在瀏覽器編譯 JSX（鎖版本 7.24.7 + SRI；鎖版號避免 latest 漂移破壞編譯） -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"
          integrity="sha384-AISI5AuDG6E8DeEiFMVB3rGQxhZt24OU0avMp+GMV64+tpnA3+Z6F5MT0f96iPva"
          crossorigin="anonymous"></script>

  <!-- 加入 ES Module Shims：解決舊版瀏覽器不支援 importmap 的問題 -->
  <script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

  <!-- 使用 Import Map 管理所有依賴 -->
  <script type="importmap">

        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
      }
    }
  </script>
</head>

  <script>
    // LICENSE 署名保留條件，請勿移除
    const ATTRIBUTION_TEXT = '白永恩基金會台南辦公室開發';
    document.getElementById('attribution').textContent = ATTRIBUTION_TEXT;

    // Firebase 設定共用常數：登入頁與 React 區段為兩個獨立 module scope，無法共享 import；
    // 改放 window 全域避免兩處硬編碼，後續更換專案只需改一處
    // 這六欄請換成你自己的 Firebase 專案設定（Firebase Console → 專案設定 → 你的應用程式 → SDK 設定與配置）
    window.FIREBASE_CONFIG = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    var WORKSHOPS = {
      sunny: { name: '陽光工坊', icon: '🌿', pinLength: 7, color: '#065f46' },
      river: { name: '河岸工坊', icon: '✨', pinLength: 7, color: '#1e3a8a' }
    };
    var SESSION_DURATION = 8 * 60 * 60 * 1000;
    var currentWorkshopId = null;
    var currentInput = '';
    var sysAdminInput = '';
    var sysAdminVerifying = false;

    function checkSession() {
      var params = new URLSearchParams(window.location.search);
      var ws = params.get('workshop');
      if (ws && WORKSHOPS[ws]) {
        var sessionData = sessionStorage.getItem('ws_login_' + ws);
        if (sessionData) {
          try {
            var data = JSON.parse(sessionData);
            if (Date.now() < data.expiry) {
              document.getElementById('login-page').style.display = 'none';
              document.getElementById('root').style.display = 'block';
              return;
            }
          } catch(e) {}
        }
        selectWorkshop(ws);
        document.getElementById('login-page').style.display = 'block';
        document.getElementById('root').style.display = 'none';
        return;
      }
      document.getElementById('login-page').style.display = 'block';
      document.getElementById('root').style.display = 'none';
    }

    function selectWorkshop(id) {
      currentWorkshopId = id;
      currentInput = '';
      var ws = WORKSHOPS[id];
      // v4.3.8: 從 innerHTML 改 textContent，避免 Firestore workshop_configs.icon 被注入 HTML 標籤時觸發 XSS（配合 default emoji 改為真實字元而非 HTML entity）
      document.getElementById('pw-icon').textContent = ws.icon;
      document.getElementById('pw-title').textContent = ws.name;
      document.getElementById('pw-title').style.color = ws.color;
      document.getElementById('pw-error').style.display = 'none';
      updateDots();
      document.getElementById('screen-select').style.display = 'none';
      document.getElementById('screen-password').style.display = 'flex';
    }

    function backToSelect() {
      currentInput = '';
      currentWorkshopId = null;
      document.getElementById('pw-error').style.display = 'none';
      document.getElementById('screen-password').style.display = 'none';
      document.getElementById('screen-select').style.display = 'flex';
      history.replaceState(null, '', window.location.pathname);
    }

    function updateDots() {
      var ws = WORKSHOPS[currentWorkshopId];
      var displayLen = 8;
      var html = '';
      for (var i = 0; i < displayLen; i++) {
        var filled = i < currentInput.length;
        html += '<div style="width:18px; height:18px; border-radius:50%; border:2.5px solid ' + (filled ? ws.color : '#cbd5e1') + '; background:' + (filled ? ws.color : 'white') + '; transition:all 0.15s;"></div>';
      }
      document.getElementById('pw-dots').innerHTML = html;
    }

    function pwInput(num) {
      var ws = WORKSHOPS[currentWorkshopId];
      if (currentInput.length >= ws.pinLength) return;
      currentInput += String(num);
      updateDots();
      document.getElementById('pw-error').style.display = 'none';
      if (currentInput.length === ws.pinLength) {
        setTimeout(checkPassword, 200);
      }
    }

    function pwDelete() {
      if (currentInput.length > 0) {
        currentInput = currentInput.slice(0, -1);
        updateDots();
      }
    }

    function pwClear() {
      currentInput = '';
      updateDots();
      document.getElementById('pw-error').style.display = 'none';
    }

    function checkPassword() {
      var errEl = document.getElementById('pw-error');
      errEl.style.display = 'none';
      // 顯示驗證中狀態
      document.getElementById('pw-dots').innerHTML = '<span style="font-size:14px; color:#94a3b8; font-weight:700;">驗證中...</span>';
      if (window.firebaseCheckPassword) {
        window.firebaseCheckPassword(currentWorkshopId, currentInput);
      } else {
        currentInput = '';
        updateDots();
        errEl.textContent = '系統尚未就緒，請稍候再試';
        errEl.style.display = 'block';
      }
    }

    function onLoginSuccess(workshopId) {
      sessionStorage.setItem('ws_login_' + workshopId, JSON.stringify({ expiry: Date.now() + SESSION_DURATION }));
      // 用真正的頁面跳轉，確保 React 重新載入並讀到正確的 workshop 參數
      window.location.href = window.location.pathname + '?workshop=' + workshopId;
    }

    function onLoginFailed() {
      currentInput = '';
      updateDots();
      var errEl = document.getElementById('pw-error');
      errEl.textContent = '密碼錯誤，請再試一次';
      errEl.style.display = 'block';
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    }

    function openSysAdminMode() {
      var overlay = document.getElementById('sysadmin-overlay');
      if (overlay) {
        overlay.style.display = 'flex';
        var inp = document.getElementById('sysadmin-input');
        if (inp) { inp.value = ''; inp.focus(); }
        document.getElementById('sysadmin-error').style.display = 'none';
      }
    }

    function closeSysAdminOverlay() {
      var overlay = document.getElementById('sysadmin-overlay');
      if (overlay) overlay.style.display = 'none';
    }

    async function submitSysAdminLogin() {
      if (sysAdminVerifying) return;
      var inp = document.getElementById('sysadmin-input');
      var pwd = inp ? inp.value.trim() : '';
      if (!pwd) return;

      var errEl = document.getElementById('sysadmin-error');
      var btnEl = document.getElementById('sysadmin-submit-btn');
      errEl.style.display = 'none';
      sysAdminVerifying = true;
      if (btnEl) { btnEl.textContent = '驗證中...'; btnEl.disabled = true; }

      try {
        if (window.firebaseAdminLogin) {
          await window.firebaseAdminLogin(pwd);
        } else {
          throw new Error('Firebase 尚未就緒');
        }
      } catch(e) {
        errEl.textContent = '密碼錯誤，請再試一次';
        errEl.style.display = 'block';
        sysAdminVerifying = false;
        if (btnEl) { btnEl.textContent = '登入系統管理員'; btnEl.disabled = false; }
        if (inp) { inp.value = ''; inp.focus(); }
      }
    }

    checkSession();

    // 版本號從 CHANGELOG 讀取更新登入頁 badge（React 模組載入後才有 CHANGELOG）
    window.addEventListener('DOMContentLoaded', function() {
      // React babel module 尚未執行，改在短暫延遲後嘗試
      function tryUpdateLoginVersion() {
        if (window.__CHANGELOG_VERSION__) {
          var badge = document.getElementById('login-version-badge');
          if (badge) badge.textContent = window.__CHANGELOG_VERSION__;
        }
      }
      setTimeout(tryUpdateLoginVersion, 1500);
    });
  </script>

  <!-- Firebase 登入驗證模組：密碼由 Firebase Auth 伺服器端驗證，不寫死在程式碼中 -->
  <script type="module">
    import { initializeApp, getApps, getApp } from 'firebase/app';
    import { getAuth, signInWithEmailAndPassword } from 'firebase/auth';
    import { getFirestore, collection, getDocs } from 'firebase/firestore';

    const firebaseConfig = window.FIREBASE_CONFIG;

    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const loginAuth = getAuth(app);
    const loginDb = getFirestore(app);

    // admin-verify 獨立 app（不影響 default app 的 auth 狀態）
    let adminVerifyAuth;
    try {
      adminVerifyAuth = getAuth(initializeApp(firebaseConfig, 'admin-verify'));
    } catch(e) {
      adminVerifyAuth = getAuth(getApp('admin-verify'));
    }

    // 預設工坊清單（Firestore 載入失敗時備用）
    const DEFAULT_WORKSHOPS = {
      sunny: { name: '陽光工坊', icon: '🌿', pinLength: 7, color: '#065f46', bgBorder: '#d1fae5', hoverBorder: '#10b981', textColor: '#065f46', subColor: '#6ee7b7', subText: 'SUNNY WORKSHOP' },
      river: { name: '河岸工坊', icon: '✨', pinLength: 7, color: '#1e3a8a', bgBorder: '#dbeafe', hoverBorder: '#3b82f6', textColor: '#1e3a8a', subColor: '#93c5fd', subText: 'RIVER WORKSHOP' }
    };

    async function loadWorkshops() {
      try {
        const snap = await getDocs(collection(loginDb, 'artifacts', 'health-station', 'workshop_configs'));
        if (!snap.empty) {
          const fromFirestore = {};
          snap.forEach(d => { if (d.data().active !== false) fromFirestore[d.id] = d.data(); });
          if (Object.keys(fromFirestore).length > 0) return fromFirestore;
        }
      } catch(e) { console.warn('工坊清單載入失敗，使用預設值', e); }
      return DEFAULT_WORKSHOPS;
    }

    function renderWorkshopButtons(workshops) {
      const container = document.getElementById('workshop-buttons');
      if (!container) return;
      // 合併到既有 WORKSHOPS，保留 pinLength 等登入頁所需屬性
      Object.entries(workshops).forEach(([id, ws]) => {
        window.WORKSHOPS[id] = { pinLength: 7, ...(window.WORKSHOPS[id] || {}), ...ws };
      });
      // 改用 createElement + textContent，避免 Firestore 工坊名稱含 < > 等字元造成 HTML 注入
      container.textContent = '';
      Object.entries(workshops).forEach(([id, ws]) => {
        const btn = document.createElement('button');
        btn.className = 'ws-btn';
        btn.addEventListener('click', () => window.selectWorkshop(id));

        const icon = document.createElement('span');
        icon.className = 'ws-icon-circle';
        icon.textContent = ws.icon || '🏢';

        const nameWrap = document.createElement('span');
        nameWrap.className = 'ws-btn-name';
        const nameMain = document.createElement('span');
        nameMain.className = 'ws-btn-name-main';
        nameMain.textContent = ws.name || '';
        const nameSub = document.createElement('span');
        nameSub.className = 'ws-btn-name-sub';
        nameSub.textContent = ws.subText || '';
        nameWrap.append(nameMain, nameSub);

        const chev = document.createElement('span');
        chev.className = 'ws-btn-chevron';
        chev.textContent = '›';

        btn.append(icon, nameWrap, chev);
        container.appendChild(btn);
      });
    }

    loadWorkshops().then(renderWorkshopButtons);

    // 由 checkPassword() 呼叫；驗證成功呼叫 onLoginSuccess，失敗呼叫 onLoginFailed
    window.firebaseCheckPassword = async function(workshopId, pin) {
      try {
        await signInWithEmailAndPassword(loginAuth, workshopId + '@health.local', pin);
        window.onLoginSuccess(workshopId);
      } catch (e) {
        window.onLoginFailed();
      }
    };

    // 系統管理員登入驗證
    window.firebaseAdminLogin = async function(password) {
      // 用 admin-verify 命名 app 驗證，不改動 default app auth 狀態
      await signInWithEmailAndPassword(adminVerifyAuth, 'admin@health.local', password);
      // 成功：設定 flag，進入 React
      window.SYSADMIN_MODE = true;
      document.getElementById('sysadmin-overlay').style.display = 'none';
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('root').style.display = 'block';
      // 若 React 已載入，直接觸發 sysAdmin 面板
      if (window.__showSysAdmin) window.__showSysAdmin();
    };
  </script>

    const dbAppId = 'health-station';

    // ── 工坊識別：從網址參數讀取，預設為 sunny ──
    const getWorkshop = () => {
      const params = new URLSearchParams(window.location.search);
      const w = params.get('workshop') || 'sunny';
      const allowed = window.WORKSHOPS ? Object.keys(window.WORKSHOPS) : ['sunny', 'river'];
      return allowed.includes(w) ? w : (allowed[0] || 'sunny');
    };
    const workshopId = getWorkshop();

              let keySnap = null;
              let lastErr = null;
              for (let attempt = 0; attempt <= delays.length; attempt++) {
                try {
                  keySnap = await getDoc(keyRef);
                  lastErr = null;
                  break;
                } catch (e) {
                  lastErr = e;
                  if (!isTransientOfflineError(e) || attempt === delays.length) throw e;

          })();
          return _initPromise;
        },

        async encrypt(text) {
          if (!text || typeof text !== 'string') return text;
          // 寫路徑：金鑰未就緒一律 throw，絕不讓明文 PII 落 DB
          if (!_key) await this.init();
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, _key, new TextEncoder().encode(text));
          const buf = new Uint8Array(12 + cipher.byteLength);
          buf.set(iv); buf.set(new Uint8Array(cipher), 12);
          return ENC_PREFIX + toB64(buf.buffer);
        },

        async decrypt(text) {
          if (!text || !String(text).startsWith(ENC_PREFIX)) return text; // 非加密欄位（含舊明文資料）原樣返回
          if (!_key) {
            // 讀路徑：金鑰未就緒不可回傳 ENC: 亂碼到 UI，嘗試初始化；失敗則 throw 給訂閱端中止
            await this.init();
          }
          try {
            const buf = new Uint8Array(fromB64(String(text).slice(ENC_PREFIX.length)));
            const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, _key, buf.slice(12));
            return new TextDecoder().decode(plain);
          } catch(e) { console.warn('CryptoHelper 解密單筆失敗:', e); return text; } // 單筆解密失敗（資料毀損）原樣返回，避免整個列表炸開
        },

        // v4.3.15: medications 整段序列化後加密（空清單也加密為 "[]"）—— encryptPatient 與管理員補加密動作共用同一份規則
        encryptMeds(meds) {
          return this.encrypt(JSON.stringify(Array.isArray(meds) ? meds : []));
        },

        // v4.3.15: 記憶體旗標（_medsPlain / _decryptFailed）顯式剝除，不得落 DB
        async encryptPatient(data) {
          const { _medsPlain, _decryptFailed, ...rest } = data;
          return {
            ...rest,
            name: await this.encrypt(data.name),
            birthday: await this.encrypt(data.birthday),
            medications: await this.encryptMeds(data.medications)
          };
        },

        // v4.3.15: medications 三態讀出 — 陣列（舊明文，標記 _medsPlain 待補加密）／ENC: 字串（解密後 JSON.parse）／其餘（缺欄位、null、壞值）一律空陣列
        async decryptPatient(data) {
          const out = { ...data, name: await this.decrypt(data.name), birthday: await this.decrypt(data.birthday) };
          const meds = data.medications;
          if (Array.isArray(meds)) {
            out._medsPlain = true; // 記憶體旗標，encryptPatient 寫入前會剝除
          } else if (typeof meds === 'string' && meds.startsWith(ENC_PREFIX)) {
            // decrypt 單筆失敗會原樣回傳 ENC: 字串（見上方 decrypt catch），故 JSON.parse 必須與 decrypt 包在同一個 try
            try {
              const parsed = JSON.parse(await this.decrypt(meds));
              if (Array.isArray(parsed)) out.medications = parsed;
              else { out.medications = []; console.warn('medications 解密失敗:', data.id, '解密結果非陣列'); }
            } catch (e) {
              // 只印 id 與錯誤型別 —— JSON.parse 的 e.message 會夾帶輸入片段（解密成功時是明文藥名、失敗時是密文），不可外印
              console.warn('medications 解密失敗:', data.id, e?.name || 'Error');
              out.medications = [];
            }
          } else {
            out.medications = [];
          }
          return out;
        }
      };
    })();

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-red-50 flex items-center justify-center p-6 font-sans text-center">
              <div className="bg-white p-8 rounded-3xl shadow-xl max-w-lg w-full border-t-8 border-red-500">
                <h2 className="text-2xl font-bold text-red-600 mb-4 flex items-center justify-center"><AlertCircle className="mr-2"/>系統發生錯誤</h2>
                <div className="bg-red-50 border border-red-200 p-4 rounded-xl text-sm font-mono text-red-700 text-left overflow-auto mb-4 font-bold max-h-48">
                  {this.state.error && this.state.error.toString()}
                </div>
                <button onClick={() => window.location.reload()} className="w-full py-4 bg-red-500 text-white rounded-2xl font-bold shadow-lg">重新載入網頁</button>
              </div>

          );
        }
        return this.props.children;
      }
    }

    const NumpadInputComponent = ({ label, value, onChange, onConfirm, unit, icon: Icon, color, placeholder = "0" }) => {
      const handleNumClick = (num) => {
        const strVal = String(value || '');
        if (num === '.' && strVal.includes('.')) return;
        
        let nextVal = (strVal === '0' && num !== '.') ? String(num) : strVal + num;
        
        // 防呆：整數最多 3 位，小數最多 1 位
        const parts = nextVal.split('.');
        if (parts[0].length > 3) return; // 阻擋 1000 以上的輸入
        if (parts.length > 1 && parts[1].length > 1) return; // 限制小數點後 1 位

        onChange(nextVal);
      };

      const handleBackspace = () => {
        const strVal = String(value);
        if (strVal.length <= 1) onChange('');
        else onChange(strVal.slice(0, -1));

        <div className="flex flex-col h-full max-w-md md:max-w-xl mx-auto w-full pt-2 md:pt-4">

      const formatDate = (ts) => {
        const d = new Date(ts);
        const y = d.getFullYear();

        return `${y}/${m}/${day}`;

      const typeTag = (rec) => {

        if (rec.recordType === 'emotion') return <span className="text-xs bg-purple-100 text-purple-600 px-2 py-0.5 rounded-full font-bold">情緒</span>;
        if (rec.recordType === 'weight') return <span className="text-xs bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full font-bold">體重</span>;
        return null;
      };

      const isEditable = (rec) => rec.recordType !== 'leave' && rec.recordType !== 'emotion';

      const handleEdit = (rec) => {
        setExpandedId(rec.id);
        setEditForm({
          temp: rec.temp ?? '',
          systolic: rec.systolic ?? '',
          diastolic: rec.diastolic ?? '',
          pulse: rec.pulse ?? '',
          pulseRecheck: rec.pulseRecheck ?? '',
          spo2: rec.spo2 ?? '',
          systolicRecheck: rec.systolicRecheck ?? '',
          diastolicRecheck: rec.diastolicRecheck ?? '',
          weight: rec.weight ?? '',
          height: rec.height ?? '',
          mood: rec.mood ?? 'happy',
        });
      };

      const handleSave = async (rec) => {
        // v4.3.5: 存檔前列出所有變動讓使用者一次確認，避免逐欄打斷
        const numOrNull = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
        const moodLabel = m => m === 'happy' ? '😄 開心' : m === 'neutral' ? '😐 普通' : m === 'sad' ? '😢 不開心' : '-';
        const fields = [
          { key: 'temp',      label: '體溫',   newVal: numOrNull(editForm.temp),      format: v => v == null ? '-' : `${v}°C` },
          { key: 'systolic',  label: '收縮壓', newVal: numOrNull(editForm.systolic),  format: v => v == null ? '-' : `${v}` },
          { key: 'diastolic', label: '舒張壓', newVal: numOrNull(editForm.diastolic), format: v => v == null ? '-' : `${v}` },
          { key: 'pulse',     label: '脈搏',   newVal: numOrNull(editForm.pulse),     format: v => v == null ? '-' : `${v}` },
          { key: 'pulseRecheck',    label: '脈搏複測',   newVal: numOrNull(editForm.pulseRecheck),    format: v => v == null ? '-' : `${v} bpm` },
          { key: 'spo2',            label: '血氧 SpO2',  newVal: numOrNull(editForm.spo2),            format: v => v == null ? '-' : `${v}%` },
          { key: 'systolicRecheck', label: '收縮壓複測', newVal: numOrNull(editForm.systolicRecheck), format: v => v == null ? '-' : `${v}` },
          { key: 'diastolicRecheck',label: '舒張壓複測', newVal: numOrNull(editForm.diastolicRecheck),format: v => v == null ? '-' : `${v}` },
          { key: 'weight',    label: '體重',   newVal: numOrNull(editForm.weight),    format: v => v == null ? '-' : `${v}kg` },
          { key: 'height',    label: '身高',   newVal: numOrNull(editForm.height),    format: v => v == null ? '-' : `${v}cm` },
          { key: 'mood',      label: '心情',   newVal: editForm.mood || null,         format: moodLabel },
        ];
        const changes = fields.filter(f => (rec[f.key] ?? null) !== (f.newVal ?? null));
        const payload = fields.reduce((acc, f) => { acc[f.key] = f.newVal; return acc; }, {});

        const doSave = async () => {
          try {
            await updateDoc(doc(db, 'artifacts', dbAppId, workshopId, 'data', 'records', rec.id), payload);
            setExpandedId(null);
          } catch (err) {
            console.error('updateDoc 失敗:', err);

        const lines = changes.map(f => `• ${f.label}：${f.format(rec[f.key] ?? null)} → ${f.format(f.newVal)}`).join('\n');
        showConfirm(
          '確認修改',

    // ============================================================================
    // 【TrashModal】服務對象垃圾桶（v4.3.11）— 軟刪除清單 + 還原 + 永久刪除
    // ============================================================================
    const TrashModal = ({ trashedPatients, isTrashExpired, onClose, onRestore, onPurge, showConfirm, showAlert, handlePermError }) => {
      const formatDeletedAt = (iso) => {
        const d = new Date(iso);
        if (!Number.isFinite(d.getTime())) return '-';
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        return `${y}/${m}/${day} ${hh}:${mm}`;
      };

      const remainingDays = (iso) => {
        const t = new Date(iso).getTime();
        if (!Number.isFinite(t)) return null;
        const ms = (t + SOFT_DELETE_RETENTION_MS) - Date.now();
        return Math.max(0, Math.ceil(ms / (24 * 60 * 60 * 1000)));
      };

      const displayName = (p) => p._decryptFailed ? `(解密失敗) #${p.id.slice(-6)}` : (p.name || '(未命名)');

      // 永久刪除採兩段 confirm：先確認永刪意圖 → 再確認連動清 records
      // v4.3.11 修正：第二段 showConfirm 用 setTimeout 0 跳出當前 batch；
      // 否則 showConfirm 內部 setDialog(open) 與 onConfirm 包裝的 setDialog(close) 會在 React 18 自動 batching 下互踩，
      // close 覆寫第二段 open → 表象「按繼續沒反應」。
      const handlePurge = (p) => {
        const label = displayName(p);
        showConfirm(
          '永久刪除確認',
          `確定要永久刪除「${label}」嗎？\n此操作無法復原。`,
          () => {
            setTimeout(() => {
              showConfirm(
                '最後確認',
                `「${label}」的所有量測 records 也會一併清除。\n確定要繼續嗎？`,
                async () => {
                  try {
                    await onPurge(p.id);
                  } catch (err) {
                    if (typeof handlePermError === 'function') handlePermError(err);
                    showAlert('永久刪除失敗', `無法刪除「${label}」：${err.message}`, 'error');
                  }
                },
                '永久刪除',
                'confirm',
                '取消'
              );
            }, 0);
          },
          '繼續',
          'confirm',
          '取消'
        );
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={onClose}>
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between p-6 border-b border-slate-100">
              <h2 className="text-xl font-extrabold text-slate-800 flex items-center gap-2">
                <Trash2 size={20} className="text-slate-500" />
                服務對象垃圾桶（{trashedPatients.length}）
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 transition-colors"><X size={24}/></button>
            </div>
            <div className="px-6 pt-4 pb-2 text-xs text-slate-500 leading-relaxed">
              軟刪除項目會保留 5 天，期間可還原；超過 5 天下次管理員開啟系統時自動永久清除。
            </div>
            <div className="overflow-y-auto p-6 space-y-3">
              {trashedPatients.length === 0 && (
                <div className="text-center py-12 text-slate-400">
                  <Trash2 size={36} className="mx-auto mb-3 opacity-30" />
                  <p className="font-bold">目前垃圾桶是空的</p>
                </div>
              )}
              {trashedPatients.map(p => {
                const days = remainingDays(p.deletedAt);
                const expired = isTrashExpired(p.deletedAt);
                return (
                  <div key={p.id} className="bg-slate-50 rounded-2xl border border-slate-100 px-4 py-3 flex items-center justify-between gap-3">
                    <div className="min-w-0 flex-1">
                      <div className="font-bold text-slate-700 text-sm truncate">{displayName(p)}</div>
                      <div className="text-xs text-slate-400 mt-0.5">
                        刪除於 {formatDeletedAt(p.deletedAt)}
                        {' ｜ '}
                        {expired
                          ? <span className="text-red-500 font-bold">已過期（待自動清除）</span>
                          : <span>剩餘 {days} 天</span>}
                      </div>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <button
                        onClick={() => onRestore(p.id)}
                        className="px-3 py-1.5 rounded-xl text-xs font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 transition-colors"
                      >還原</button>
                      <button
                        onClick={() => handlePurge(p)}
                        className="px-3 py-1.5 rounded-xl text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 transition-colors"
                      >永久刪除</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    // ============================================================================

    // ============================================================================
    // 【脈搏複測 Modal】服務對象使用血氧機進行複測量測
    // ============================================================================
    // v4.3.6: 通用複測 Modal — 依 flowType 決定步驟序列
    //   'bp_only'    → 收縮壓 → 舒張壓 → 脈搏（3 步）
    //   'pulse_only' → 脈搏 → 血氧（2 步）
    //   'both'       → 收縮壓 → 舒張壓 → 脈搏 → 血氧（4 步）
    const PulseRecheckModal = ({ isOpen, onClose, onSubmit, flowType, showAlert }) => {
      // 依 flowType 組步驟序列；每步定義欄位 key、標題、單位、validator
      const FIELD_DEFS = {
        systolic:  { label: '收縮壓', unit: 'mmHg', min: 50,  max: 250 },
        diastolic: { label: '舒張壓', unit: 'mmHg', min: 30,  max: 180 },
        pulse:     { label: '脈搏',   unit: '下/分', min: 30,  max: 250 },
        spo2:      { label: '血氧',   unit: '%',    min: 50,  max: 100 },
      };
      const STEP_FIELDS = {
        bp_only:    ['systolic', 'diastolic', 'pulse'],
        pulse_only: ['pulse', 'spo2'],
        both:       ['systolic', 'diastolic', 'pulse', 'spo2'],
      };
      const stepFields = STEP_FIELDS[flowType] || STEP_FIELDS.pulse_only;
      const totalSteps = stepFields.length;

      const [step, setStep] = React.useState(1);
      const [values, setValues] = React.useState({});
      const [submitting, setSubmitting] = React.useState(false);

      // flowType 切換或開啟時 reset
      React.useEffect(() => {
        if (isOpen) { setStep(1); setValues({}); }
      }, [isOpen, flowType]);

      if (!isOpen) return null;

      const currentField = stepFields[step - 1];
      const currentDef = FIELD_DEFS[currentField];
      const currentValue = values[currentField] || '';

      const setCurrentValue = (updater) => {
        setValues(prev => ({
          ...prev,
          [currentField]: typeof updater === 'function' ? updater(prev[currentField] || '') : updater
        }));
      };

      const handleNumClick = (num) => {
        setCurrentValue(prev => prev.length >= 3 ? prev : prev + String(num));
      };
      const handleBackspace = () => setCurrentValue(prev => prev.slice(0, -1));
      const handleClear = () => setCurrentValue('');

      const numVal = currentValue !== '' ? parseInt(currentValue, 10) : NaN;
      const isCurrentValid = !isNaN(numVal) && numVal >= currentDef.min && numVal <= currentDef.max;

      // v4.3.14: 跨欄防呆 — 舒張壓不可大於或等於收縮壓（對齊主 wizard 防呆）；攔截時彈警示並回 true
      const blockDiaGteSys = (dia, sys) => {
        if (parseInt(dia, 10) >= parseInt(sys, 10)) {
          showAlert("防呆機制攔截", "舒張壓不可大於或等於收縮壓，請重新確認數值。", "error");
          return true;
        }
        return false;
      };

      const handleNext = () => {
        if (!isCurrentValid) return;
        if (currentField === 'diastolic' && blockDiaGteSys(currentValue, values.systolic)) return;
        if (step < totalSteps) setStep(step + 1);
      };

      const handleSubmit = async () => {
        if (!isCurrentValid || submitting) return;
        // v4.3.14: 血壓流程送出前跨欄保險，與 handleNext 防呆同準則
        if ((flowType === 'bp_only' || flowType === 'both') && blockDiaGteSys(values.diastolic, values.systolic)) return;
        setSubmitting(true);
        try {
          const parsed = {};
          stepFields.forEach(f => {
            const v = values[f];
            parsed[f] = (v !== undefined && v !== '') ? parseInt(v, 10) : null;
          });
          await onSubmit(parsed, flowType);
        } finally {
          setSubmitting(false);
        }
      };

      const handleClose = () => {
        // 中途關閉：state 由 effect 在下次開啟時 reset；先觸發 onClose 給 parent
        onClose();
      };

      const BRAND = '#E8750A';

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={handleClose}>
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm" onClick={e => e.stopPropagation()}>
            {/* Header */}
            <div className="flex items-center justify-between px-6 pt-5 pb-4 border-b border-slate-100">
              <h2 className="text-lg font-extrabold text-slate-800 flex items-center gap-2">
                <Heart size={18} className="text-orange-500" />
                請輸入{currentDef.label}（{step}/{totalSteps}）
              </h2>
              <button onClick={handleClose} className="text-slate-400 hover:text-slate-600"><X size={22}/></button>
            </div>

            <div className="px-5 pt-4 pb-5">
              {/* 數值顯示區 */}
              <div className="flex items-baseline justify-center gap-3 mb-4 py-3 bg-slate-50 rounded-2xl">
                <span className="text-5xl font-black" style={{ color: currentValue ? '#1e293b' : '#cbd5e1', letterSpacing: '-1px' }}>
                  {currentValue || '--'}
                </span>
                <span className="text-lg font-bold text-slate-400">{currentDef.unit}</span>
              </div>

              {/* 計算機鍵盤 */}
              <div className="grid grid-cols-3 gap-2 mb-2">
                {[1,2,3,4,5,6,7,8,9].map(num => (
                  <button key={num} onClick={() => handleNumClick(num)} className="bg-white rounded-2xl shadow-sm border-b-4 border-slate-200 text-2xl font-black text-slate-700 active:border-b-0 active:translate-y-1 transition-all py-3">
                    {num}
                  </button>
                ))}
              </div>
              <div className="grid grid-cols-3 gap-2 mb-4">
                <button onClick={handleClear} className="bg-slate-100 rounded-2xl shadow-sm border-b-4 border-slate-200 text-base font-bold text-slate-500 active:border-b-0 active:translate-y-1 transition-all py-3">清除</button>
                <button onClick={() => handleNumClick(0)} className="bg-white rounded-2xl shadow-sm border-b-4 border-slate-200 text-2xl font-black text-slate-700 active:border-b-0 active:translate-y-1 transition-all py-3">0</button>
                <button onClick={handleBackspace} className="bg-white rounded-2xl shadow-sm border-b-4 border-slate-200 text-xl font-black text-slate-500 active:border-b-0 active:translate-y-1 transition-all py-3">⌫</button>
              </div>

              {/* 底部按鈕（不提供上一步；按錯關閉重來） */}
              <div className="flex gap-3">
                <button onClick={handleClose} className="flex-1 py-3.5 rounded-xl bg-slate-100 text-slate-500 font-bold hover:bg-slate-200 transition-colors">取消</button>
                {step < totalSteps ? (
                  <button
                    onClick={handleNext}
                    disabled={!isCurrentValid}
                    className="flex-1 py-3.5 rounded-xl text-white font-bold transition-colors disabled:opacity-40 flex items-center justify-center gap-1.5"
                    style={{ background: isCurrentValid ? BRAND : undefined }}
                  >
                    下一步 →
                  </button>
                ) : (
                  <button
                    onClick={handleSubmit}
                    disabled={!isCurrentValid || submitting}
                    className="flex-1 py-3.5 rounded-xl text-white font-bold transition-colors disabled:opacity-40 flex items-center justify-center gap-1.5"
                    style={{ background: (isCurrentValid && !submitting) ? BRAND : undefined }}
                  >
                    {submitting ? <Loader2 size={16} className="animate-spin"/> : <CheckCircle size={16}/>}
                    確認送出
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ============================================================================
    // 【選藥視窗元件】新增/編輯服務對象時，從資料庫直接選藥
    // ============================================================================
    const DrugPickerModal = ({ isOpen, onClose, onSelect, onAddNewDrug, onUpdateDrug, onDeleteDrug, medicationsDB, isAdmin }) => {
      const [search, setSearch] = React.useState('');
      const [showAddForm, setShowAddForm] = React.useState(false);
      const [editingDrug, setEditingDrug] = React.useState(null); // null=新增, drug物件=編輯
      const [formDrug, setFormDrug] = React.useState({ name: '', indication: '', sideEffects: '' });
      const [saving, setSaving] = React.useState(false);
      const [dupWarning, setDupWarning] = React.useState(''); // 重複警告訊息

      if (!isOpen) return null;

      // 合併雲端資料庫 + 內建預設，雲端優先，去除重複（用 Set 做 O(1) 查詢）
      const dbNameSet = new Set(medicationsDB.map(x => x.name));
      const allDrugs = [...medicationsDB];
      DEFAULT_MEDICATIONS.forEach(d => {
        if (!dbNameSet.has(d.name)) allDrugs.push(d);
      });
      // 排序：英文（字母順序）在前，中文（筆畫順序）在後
      allDrugs.sort((a, b) => {
        const aName = a.name || '';
        const bName = b.name || '';
        const aIsEng = /^[A-Za-z]/.test(aName);
        const bIsEng = /^[A-Za-z]/.test(bName);
        if (aIsEng && bIsEng) return aName.localeCompare(bName, 'en', { sensitivity: 'base' });
        if (!aIsEng && !bIsEng) return aName.localeCompare(bName, 'zh-TW-u-co-stroke');
        return aIsEng ? -1 : 1; // 英文在前
      });

      // 偵測重複（相同名稱，忽略大小寫和空白）
      const normalize = (s) => s.toLowerCase().replace(/\s+/g, '');
      const duplicateGroups = medicationsDB.reduce((acc, drug) => {
        const key = normalize(drug.name);
        if (!acc[key]) acc[key] = [];
        acc[key].push(drug);
        return acc;
      }, {});
      const hasDuplicates = Object.values(duplicateGroups).some(g => g.length > 1);
      // 建立 O(1) 查詢 Map，供 checkDuplicate 使用（避免每次呼叫都做 O(n) find）
      const normalizedNameMap = new Map(medicationsDB.map(d => [normalize(d.name), d]));

      const filtered = search.trim()
        ? allDrugs.filter(d => d.name.toLowerCase().includes(search.trim().toLowerCase()) || (d.indication || '').includes(search.trim()))
        : allDrugs;

      // 檢查新增名稱是否重複 — O(1)
      const checkDuplicate = (name) => {
        const normalized = normalize(name.trim());
        const found = normalizedNameMap.get(normalized);
        const isDup = found && found.id !== editingDrug?.id;
        setDupWarning(isDup ? `「${found.name}」已存在資料庫，請確認是否重複。` : '');
      };

      const openAddForm = () => {
        setEditingDrug(null);
        setFormDrug({ name: search, indication: '', sideEffects: '' });
        setDupWarning('');
        setShowAddForm(true);
      };

      const openEditForm = (drug, e) => {
        e.stopPropagation();
        setEditingDrug(drug);
        setFormDrug({ name: drug.name, indication: drug.indication || '', sideEffects: drug.sideEffects || '' });
        setDupWarning('');
        setShowAddForm(true);
      };

      const handleSave = async () => {
        if (!formDrug.name.trim()) return;
        setSaving(true);
        try {
          if (editingDrug?.id) {
            // 雲端資料：直接更新
            await onUpdateDrug(editingDrug.id, formDrug);

    };

    // ============================================================================
    // 【全域常數】集中管理所有魔術數字，方便日後調整
    // ============================================================================
    const PHOTO_TARGET_PX    = 350;    // 照片壓縮像素（正方形）— 適合 15~30 人規模，兼顧品質與頻寬
    const PHOTO_JPEG_QUALITY = 0.80;   // 照片 JPEG 壓縮品質（0~1）
    const DB_TIMEOUT_MS      = 15000;  // Firestore 操作逾時（毫秒）
    const QUARTER_MEASURE_DAY = 22;    // 每月量測週起始日

    // ============================================================================
    // 【App 主程式】
    // ============================================================================
    function MainApp() {
      const [view, setView] = useState('list'); 
      const [isAdmin, setIsAdmin] = useState(false);

      const [reportMonth, setReportMonth] = useState(new Date().toISOString().slice(0, 7));
