      // 只認得兩個單位的硬編碼寫法；單位多於兩個時，這裡要改成從 WORKSHOPS[workshopId].name 查表
      const appName = workshopId === 'river' ? '河岸工坊健康站' : '陽光工坊健康站'; // 依工坊切換名稱
      const [patients, setPatients] = useState([]);
      // v4.3.11: 軟刪除（含 deletedAt 欄位）的 patient — 與 patients 同一 onSnapshot 解析後 partition
      const [trashedPatients, setTrashedPatients] = useState([]);
      const [showTrash, setShowTrash] = useState(false);
      // v4.3.11: 打字確認姓名刪除流程的目標 patient（{id, name}），null 時不顯示確認 modal
      const [deleteConfirmPatient, setDeleteConfirmPatient] = useState(null);
      const [records, setRecords] = useState([]);
      // v4.3.6: 報表/編輯 Modal 用 — 跨時間軸的歷史紀錄，按需 getDocs 拉取，不訂閱
      const [reportRecords, setReportRecords] = useState([]);
      const [medicationsDB, setMedicationsDB] = useState([]);
      const [user, setUser] = useState(null);
      const [selectedPatientId, setSelectedPatientId] = useState(null);
      const [editingPatientId, setEditingPatientId] = useState(null);
      const [wizardStep, setWizardStep] = useState(0);
      // 狀態重置，確保原始數值為空
      const [tempRecord, setTempRecord] = useState({ temp: '', systolic: '', diastolic: '', pulse: '', mood: 'happy', recordType: 'checkin', weight: '', height: '', status: 'completed' });
      const [newPatient, setNewPatient] = useState({ name: '', birthday: '', gender: '男', photo: null, medications: [] });
      const [dbSetupError, setDbSetupError] = useState('');
      // v4.3.12: 連線狀態可見化 — patients 首批快照旗標 / 快照來自快取旗標 / 金鑰初始化錯誤 / 重試計數（遞增觸發主訂閱 effect 重跑）
      const [patientsLoaded, setPatientsLoaded] = useState(false);
      const [isFromCache, setIsFromCache] = useState(false);
      const [cryptoInitError, setCryptoInitError] = useState('');
      const [retryNonce, setRetryNonce] = useState(0);
      const [isCompressing, setIsCompressing] = useState(false); 
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isBackfilling, setIsBackfilling] = useState(false); // v4.3.15: 用藥清單補加密進行中（防重入）
      const [drugPickerIndex, setDrugPickerIndex] = useState(null); // null = 關閉，數字 = 正在選第幾格藥物
      const [showChangelog, setShowChangelog] = useState(false);
      const [editRecordsPatientId, setEditRecordsPatientId] = useState(null);
      const [showPulseRecheck, setShowPulseRecheck] = useState(false);
      const [recheckFlowType, setRecheckFlowType] = useState('pulse_only'); // v4.3.6: 'bp_only' | 'pulse_only' | 'both'
      const [recheckTargetRecordId, setRecheckTargetRecordId] = useState(null);
      const [showSysAdmin, setShowSysAdmin] = useState(false);
      const [sysAdminWorkshops, setSysAdminWorkshops] = useState([]);
      const [newWorkshop, setNewWorkshop] = useState({ id: '', name: '', icon: '🏢', color: '#1e293b', pin: '' });
      const [sysAdminLoading, setSysAdminLoading] = useState(false);
      const [sysAdminTab, setSysAdminTab] = useState('workshops'); // 'workshops' | 'passwords' | 'changelog'

      const fileInputRef = useRef(null);
      const cameraInputRef = useRef(null);
      // v4.3.8: patients 的最新值用 ref 持有，避免報表 useEffect 依賴 patients 導致每次量測寫入觸發 onSnapshot → setPatients → effect 重跑 → N 個 patient 全歷史 getDocs 放大讀取
      const patientsRef = useRef([]);

      if (moduleCrashError) {
        return (
          <div className="min-h-screen bg-red-50 flex items-center justify-center p-6 font-sans text-center">
            <div className="bg-white p-8 rounded-3xl shadow-xl max-w-lg w-full border-t-8 border-red-500">
              <AlertCircle className="w-16 h-16 text-red-500 mx-auto mb-4" />
              <h2 className="text-2xl font-bold text-slate-800 mb-4">系統初始化失敗</h2>
              <p className="text-slate-600 mb-4 text-left font-bold">這可能是因為 Firebase 尚未完成設定或瀏覽器連線受阻。</p>
            </div>
          </div>
        );
      }

      const calculateAge = (birthdayString) => {
        if (!birthdayString) return '';
        const today = new Date();
        const birthDate = new Date(birthdayString);
        let age = today.getFullYear() - birthDate.getFullYear();
        const m = today.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
        return age;
      };

      // 依照國健署高血壓分類表標準，systolic 與 diastolic 各自獨立判斷顏色（v4.3.1 起改為獨立判斷，CHANGELOG 有紀錄）
      // 回傳包含背景色與文字色的 class 字串（供 td className 直接使用）
      const getSystolicStyle = (sys) => {
        const s = parseFloat(sys);
        if (!s) return "text-slate-700 font-normal";
        if (s < 90) return "text-blue-700 font-bold bg-[#eff6ff]";
        if (s >= 140) return "text-red-700 font-bold bg-[#fff1f2]";
        if (s >= 130) return "text-orange-600 font-bold bg-[#fffbeb]";
        return "text-slate-900 font-normal";
      };

      const getDiastolicStyle = (dia) => {
        const d = parseFloat(dia);
        if (!d) return "text-slate-700 font-normal";
        if (d < 60) return "text-blue-700 font-bold bg-[#eff6ff]";
        if (d >= 90) return "text-red-700 font-bold bg-[#fff1f2]";
        if (d >= 80) return "text-orange-600 font-bold bg-[#fffbeb]";
        return "text-slate-900 font-normal";
      };

      const handlePermError = useCallback((err) => {
        console.error(err);
        // v4.3.12: 除 permission-denied 外，failed-precondition（缺索引）與 unavailable（連線不可用）也分類寫入，由頂部紅色錯誤條顯示
        if (['permission-denied', 'failed-precondition', 'unavailable'].includes(err.code)) setDbSetupError(err.code);
      }, []);

      const showAlert = useCallback((title, message, type = 'info') => {
        setDialog({ isOpen: true, title, message: String(message), type, onConfirm: () => setDialog(prev => ({ ...prev, isOpen: false })), confirmText: '知道了' });
      }, []);

      const showConfirm = useCallback((title, message, onConfirmAction, confirmText = "確定", type = 'confirm', cancelText = "取消") => {
        setDialog({ isOpen: true, title, message: String(message), type, confirmText, cancelText, onConfirm: () => { onConfirmAction(); setDialog(prev => ({ ...prev, isOpen: false })); }, onCancel: () => setDialog(prev => ({ ...prev, isOpen: false })) });
      }, []);

      const handlePhotoUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsCompressing(true);
        await new Promise(resolve => setTimeout(resolve, 50)); // 讓 spinner 先渲染再進行 CPU 密集壓縮
        const objectUrl = URL.createObjectURL(file);

        try {
          await new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
              try {
                const canvas = document.createElement('canvas');
                canvas.width  = PHOTO_TARGET_PX;
                canvas.height = PHOTO_TARGET_PX;
                const ctx = canvas.getContext('2d', { alpha: false });
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, PHOTO_TARGET_PX, PHOTO_TARGET_PX);
                const size = Math.min(img.width, img.height);
                ctx.drawImage(img, (img.width - size) / 2, (img.height - size) / 2, size, size, 0, 0, PHOTO_TARGET_PX, PHOTO_TARGET_PX);
                setNewPatient(prev => ({ ...prev, photo: canvas.toDataURL('image/jpeg', PHOTO_JPEG_QUALITY) }));
                resolve();
              } catch(err) { reject(err); }
            };
            img.onerror = () => reject(new Error('照片解析失敗'));
            img.src = objectUrl;
          });
        } catch(err) {
          console.error('照片上傳失敗:', err);
          showAlert('錯誤', err.message === '照片解析失敗'
            ? '照片解析失敗，檔案可能損毀或格式不支援。'
            : '照片處理失敗，請嘗試調低相機畫素。', 'error');
        } finally {
          URL.revokeObjectURL(objectUrl);
          setIsCompressing(false);
          if (fileInputRef.current) fileInputRef.current.value = '';
          if (cameraInputRef.current) cameraInputRef.current.value = '';
        }

      };

      // 暴露 sysAdmin 觸發介面給 Vanilla JS 層，並偵測已設好的 flag
      useEffect(() => {
        window.__showSysAdmin = () => {
          setShowSysAdmin(true);
          loadSysAdminWorkshops();
        };
        if (window.SYSADMIN_MODE) {
          setShowSysAdmin(true);
          loadSysAdminWorkshops();
        }
        return () => { delete window.__showSysAdmin; };
      }, []);

      useEffect(() => {
        // 使用 Firebase Email/Password 驗證後，onAuthStateChanged 會自動恢復已登入狀態
        const unsubscribe = onAuthStateChanged(auth, (u) => {
          setUser(u);
          if (!u) {
            // 若 App 畫面已顯示但 Firebase session 無效，清除前端 session 並強制重新登入
            const loginPageHidden = document.getElementById('login-page')?.style.display === 'none';
            if (loginPageHidden) {
              sessionStorage.removeItem('ws_login_' + workshopId);
              window.location.replace(window.location.pathname);
            }
          }
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        // v4.3.8: sysadmin 模式只動 workshop_configs（跨工坊層），不需要單一工坊的 patient/record/encryptionKey；之前在電腦進 sysadmin 時，default auth 從 IndexedDB 恢復舊工坊 token 會誤觸 CryptoHelper.init()，踩到 client-is-offline
        if (window.SYSADMIN_MODE) return;
        // v4.3.9: v4.3.8 的 SYSADMIN_MODE guard 有時序漏洞——React mount 後 onAuthStateChanged 從 IndexedDB 恢復 user 早於使用者輸入 sysadmin 密碼設 SYSADMIN_MODE，guard 來不及生效。改用 user.email 與當前 workshopId 是否匹配作為終極守門：不匹配時 (1) 之前測試殘留的 admin token (2) 切工坊但 IndexedDB 還是舊工坊 token，都直接跳過訂閱，避免 Firestore rules 擋住的「Missing or insufficient permissions」彈窗
        const expectedEmail = workshopId + '@health.local';
        if (user.email !== expectedEmail) {
          console.warn(`auth user (${user.email}) 與當前工坊 (${workshopId}) 不匹配，跳過訂閱`);
          return;
        }
        let cancelled = false;
        let unsubPatients = null, unsubRecords = null, unsubMeds = null;
        (async () => {
          try {
            await CryptoHelper.init(); // 必須等金鑰就緒才訂閱，避免 onSnapshot 拿到資料時 decrypt 仍未準備好
            if (!cancelled) setCryptoInitError(''); // v4.3.12: 重試或重登成功後清除殘留錯誤
          } catch (e) {
            // v4.3.12: 改為列表頁可見錯誤框 + 「重試」按鈕（CryptoHelper 失敗時已自行重置 _initPromise，重跑本 effect 即可重試），不再要求重新整理頁面
            if (!cancelled) setCryptoInitError(e.message || String(e));
            return;
          }
          if (cancelled) return;
          unsubPatients = onSnapshot(
            query(collection(db, 'artifacts', dbAppId, workshopId, 'data', 'patients'), limit(500)),
            { includeMetadataChanges: true }, // v4.3.12: 偵測 fromCache（離線/弱網）狀態
            async (s) => {
              // v4.3.12: 首批快照已到 → 列表脫離「載入中」（不可用 patients.length 判斷，空工坊會永遠轉圈）；fromCache 驅動頂部連線橫幅
              setPatientsLoaded(true);
              setIsFromCache(s.metadata.fromCache);
              // v4.3.12: metadata-only 變化（docs 無實質變動）跳過重解密；docChanges() 預設不含 metadata-only 變更
              if (s.docChanges().length === 0) return;
              // v4.3.11: 每筆獨立 try/catch，失敗筆加 _decryptFailed 旗標（與 CryptoHelper.decrypt 單筆失敗返回原值的策略對齊）
              // 完成後依 deletedAt 欄位 partition 出 active vs trashed，讓主列表與垃圾桶共用同一個訂閱
              const decryptedAll = await Promise.all(
                s.docs.map(async d => {
                  try {
                    // v4.3.15: 帶 id 進 decryptPatient，medications 解密失敗時 console.warn 才印得出是哪一筆
                    return { id: d.id, ...await CryptoHelper.decryptPatient({ id: d.id, ...d.data() }) };
                  } catch (e) {
                    console.warn('patient 解密失敗:', d.id, e);
                    // v4.3.15: 失敗筆的 medications 可能是未解密的 ENC: 字串，補空陣列保證下游消費點型別一致
                    return { id: d.id, ...d.data(), medications: [], _decryptFailed: true };
                  }
                })
              );
              if (cancelled) return;
              const active = [];
              const trashed = [];
              decryptedAll.forEach(p => (p.deletedAt ? trashed : active).push(p));
              setPatients(active);
              setTrashedPatients(trashed);
            },
            handlePermError
          );
          // v4.3.13: 訂閱範圍從固定 31 天縮為「本月 1 號 00:00」與「昨天 00:00」取較早者
          // 主畫面只消費今天/昨天/本月的 records（卡片狀態、進度條、昨日血壓 badge、本月 weight），縮窗減少讀取量
          // 取較早者的理由：每月 1 號當天「昨天」落在上月底，只取月初會漏掉昨日血壓 badge 的資料
          // 時區：timestamp 是 toISOString() 產生的 UTC 字串，cutoff 必須以本地時區建時點再 toISOString()，不可手拼日期字串
          // timestamp 為 ISO 字串，字典序與時間序一致，可直接用 where 比較
          // cutoff 在 effect 入口算一次，session 內固定（跨日邊界少見，可接受）
          const now = new Date();
          const monthStart = new Date(now.getFullYear(), now.getMonth(), 1); // 本地本月 1 號 00:00
          const yesterdayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1); // 本地昨天 00:00（date-1 為 0 時自動跨到上月底）
          const recordsCutoff = new Date(Math.min(monthStart.getTime(), yesterdayStart.getTime())).toISOString();
          unsubRecords = onSnapshot(
            query(
              collection(db, 'artifacts', dbAppId, workshopId, 'data', 'records'),
              where('timestamp', '>=', recordsCutoff),
              orderBy('timestamp', 'desc'),
              limit(2000)
            ),
            (s) => setRecords(s.docs.map(d => ({id: d.id, ...d.data()}))),
            handlePermError
          );
          unsubMeds = onSnapshot(query(collection(db, 'artifacts', dbAppId, workshopId, 'data', 'medications'), limit(300)), (s) => setMedicationsDB(s.docs.map(d => ({id: d.id, ...d.data()}))), handlePermError);
        })();
        return () => {
          cancelled = true;
          unsubPatients?.(); unsubRecords?.(); unsubMeds?.();
        };
      }, [user, handlePermError, retryNonce]); // v4.3.12: retryNonce 遞增 → 清掉舊訂閱後重跑 init + 三訂閱

      // v4.3.8: 同步 patients 到 ref，供報表 useEffect 取最新值但不觸發其重跑
      useEffect(() => { patientsRef.current = patients; }, [patients]);

      // v4.3.6: 報表與編輯 Modal 用的歷史紀錄按需載入
      // 觸發時機：進入 report view 或開啟 EditRecordsModal 時拉一次
      // 索引需求：複合索引 records(patientId ASC, timestamp DESC) — Firebase Console 手動建立
      // 進入 report view → 依 reportPatientId 拉資料（'all' 拉所有 patients）
      // EditRecordsModal 只從 report 內按鈕開啟，已有 reportRecords，不需另外拉
      // v4.3.8: 依賴從 patients 改 patientsRef，避免量測寫入觸發 onSnapshot → setPatients 時，'all' 模式下重新撈所有 patient 全歷史紀錄
      useEffect(() => {
        if (view !== 'report' || !user) return;
        const ids = reportPatientId === 'all' ? patientsRef.current.map(p => p.id) : [reportPatientId];
        if (ids.length === 0) { setReportRecords([]); return; }
        let cancelled = false;
        (async () => {
          try {
            const results = await Promise.all(ids.map(pid =>
              getDocs(query(
                collection(db, 'artifacts', dbAppId, workshopId, 'data', 'records'),
                where('patientId', '==', pid),
                orderBy('timestamp', 'desc')
              )).then(s => s.docs.map(d => ({ id: d.id, ...d.data() })))
            ));
            if (!cancelled) setReportRecords(results.flat());
          } catch (e) {
            console.error('loadReportRecords 失敗:', e);
            if (!cancelled) handlePermError(e);
          }
        })();
        return () => { cancelled = true; };
      }, [view, reportPatientId, user, handlePermError]);

      useEffect(() => {
        const timer = setInterval(() => setCurrentDate(new Date()), 60000);
        return () => clearInterval(timer);
      }, []);

      // ============================================================================
      // v4.3.11: 服務對象軟刪除 / 還原 / 永久刪除
      // ============================================================================
      // 過期判斷：deletedAt（ISO 字串）+ 5 天保留期 < 現在
      const isTrashExpired = useCallback((deletedAt) => {
        if (!deletedAt) return false;
        const t = new Date(deletedAt).getTime();
        if (!Number.isFinite(t)) return false;
        return t + SOFT_DELETE_RETENTION_MS < Date.now();
      }, []);

      // 軟刪除：在 patient document 寫入 deletedAt 時間戳
      const softDeletePatient = useCallback(async (patientId) => {
        try {
          await updateDoc(doc(db, 'artifacts', dbAppId, workshopId, 'data', 'patients', patientId), {
            deletedAt: new Date().toISOString(),
          });
        } catch (err) {
          handlePermError(err);
        }
      }, [dbAppId, workshopId, handlePermError]);

      // 還原：清除 deletedAt 欄位
      const restorePatient = useCallback(async (patientId) => {
        try {
          await updateDoc(doc(db, 'artifacts', dbAppId, workshopId, 'data', 'patients', patientId), {
            deletedAt: deleteField(),
          });
        } catch (err) {
          handlePermError(err);
        }
      }, [dbAppId, workshopId, handlePermError]);

      // ============================================================================
      // v4.3.15: 舊明文用藥清單一次性補加密（管理員動作）
      // ============================================================================
      // 目標＝讀出時帶 _medsPlain 旗標者（medications 仍是明文陣列），含垃圾桶內的軟刪除項；
      // 完全沒有 medications 欄位的舊文件讀出即為空陣列、無旗標，不列入。
      // useMemo 必須宣告在 backfillMedsEncryption 之前：useCallback 的依賴陣列在 render 時求值，順序顛倒會踩 TDZ。
      const plainMedsPatients = useMemo(
        () => [...patients, ...trashedPatients].filter(p => p._medsPlain),
        [patients, trashedPatients]
      );

      // 逐筆序列 updateDoc，只送 medications 單一欄位（不含 updatedAt，避免蓋掉真實編輯時間）
      // 單筆失敗只計數續跑；遇 permission-denied 交 handlePermError 後中止（權限問題續跑無意義）
      const backfillMedsEncryption = useCallback(async () => {
        if (isBackfilling) return;
        setIsBackfilling(true);
        let ok = 0, fail = 0, aborted = false;
        try {
          for (const p of plainMedsPatients) {
            try {
              const enc = await CryptoHelper.encryptMeds(p.medications);
              const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('網路連線逾時，請檢查連線狀態。')), DB_TIMEOUT_MS));
              await Promise.race([
                updateDoc(doc(db, 'artifacts', dbAppId, workshopId, 'data', 'patients', p.id), { medications: enc }),
                timeoutPromise
              ]);
              ok++;
            } catch (err) {
              if (err?.code === 'permission-denied') { handlePermError(err); aborted = true; break; }
              fail++;
              console.warn('補加密單筆失敗:', p.id, err?.code || err?.message || 'Error'); // 只印 id 與錯誤碼，不印藥名或密文
            }
          }
          if (!aborted) showAlert('補加密完成', `成功 ${ok} 筆／失敗 ${fail} 筆`);
        } finally {
          setIsBackfilling(false);
        }
      }, [isBackfilling, plainMedsPatients, dbAppId, workshopId, handlePermError, showAlert]);

      // 永久刪除：先 batch 刪該 patientId 的所有 records，再刪 patient document
      // 走獨立 getDocs（不依賴 31 天訂閱），確保連同歷史紀錄一併清除
      const purgePermanently = useCallback(async (patientId) => {
        const recordsSnap = await getDocs(query(
          collection(db, 'artifacts', dbAppId, workshopId, 'data', 'records'),
          where('patientId', '==', patientId)
        ));
        if (!recordsSnap.empty) {
          // writeBatch 上限 500 筆；長期累積極端情況需分批，此處依 31 天主訂閱 + 量測頻率（每人每日 1-2 筆）估算遠低於上限
          const batch = writeBatch(db);
          recordsSnap.docs.forEach(d => batch.delete(d.ref));
          await batch.commit();
        }
        await deleteDoc(doc(db, 'artifacts', dbAppId, workshopId, 'data', 'patients', patientId));
      }, [dbAppId, workshopId]);

      // 過期自動清除：管理員身分 + onSnapshot 第一次回傳含軟刪除項時，掃一次過期項目永久刪除
      // 每筆獨立 try/catch 吃掉 race condition 錯誤（not-found / permission-denied），best-effort 清理
      // ref flag 確保同 session 內只跑一次：避免每次 onSnapshot 推送都重跑，也避免 purge 後 onSnapshot 觸發無限迴圈
      const autoPurgeRanRef = useRef(false);
      useEffect(() => {
        if (!isAdmin) { autoPurgeRanRef.current = false; return; } // 登出管理員 → reset 旗標供下次重跑
        if (autoPurgeRanRef.current) return;
        if (trashedPatients.length === 0) return; // 等 onSnapshot 第一次帶資料回來才跑
        autoPurgeRanRef.current = true;
        let cancelled = false;
        (async () => {
          for (const p of trashedPatients) {
            if (cancelled) return;
            if (!isTrashExpired(p.deletedAt)) continue;
            try {
              await purgePermanently(p.id);
            } catch (e) {
              if (e?.code !== 'not-found' && e?.code !== 'permission-denied') {
                console.warn('auto-purge 單筆失敗:', p.id, e);
              }
            }
          }
        })();
        return () => { cancelled = true; };
      }, [isAdmin, trashedPatients, isTrashExpired, purgePermanently]);

      const activePatient = useMemo(() => patients.find(p => p.id === selectedPatientId), [patients, selectedPatientId]);

      // 報表篩選患者：在元件層 useMemo，避免每次 renderReport() 呼叫時重新計算
      const filteredPatients = useMemo(
        () => reportPatientId === 'all' ? patients : patients.filter(p => p.id === reportPatientId),
        [patients, reportPatientId]
      );

      const isQuarterEnd = useMemo(() => {
        // 每月第四週：QUARTER_MEASURE_DAY 日起到月底
        return currentDate.getDate() >= QUARTER_MEASURE_DAY;
      }, [currentDate]);

      const toggleAdminLogin = () => {
        if (isAdmin) { setIsAdmin(false); showAlert('已登出', '您已登出管理員模式'); }
        else { setAdminPassword(''); setShowAdminLogin(true); }
      };

      const loadSysAdminWorkshops = async () => {
        setSysAdminLoading(true);
        try {
          const snap = await getDocs(collection(db, 'artifacts', dbAppId, 'workshop_configs'));
          if (snap.empty) {
            const defaults = [
              { id: 'sunny', name: '陽光工坊', icon: '🌿', color: '#065f46', active: true },
              { id: 'river', name: '河岸工坊', icon: '✨', color: '#1e3a8a', active: true },
            ];
            for (const ws of defaults) {
              await setDoc(doc(db, 'artifacts', dbAppId, 'workshop_configs', ws.id), { name: ws.name, icon: ws.icon, color: ws.color, active: ws.active });
            }
            setSysAdminWorkshops(defaults);
          } else {
            setSysAdminWorkshops(snap.docs.map(d => ({ id: d.id, ...d.data() })));
          }
        } catch(e) {
          // Firestore 讀取失敗時，改用 window.WORKSHOPS 備援（登入頁已載入）
          if (window.WORKSHOPS && Object.keys(window.WORKSHOPS).length > 0) {
            const fallback = Object.entries(window.WORKSHOPS).map(([id, ws]) => ({
              id, name: ws.name || id, icon: ws.icon || '🏢', color: ws.color || '#6366f1', active: true
            }));
            setSysAdminWorkshops(fallback);
          } else {
            showAlert('載入失敗', e.message, 'error');
          }
        }
        setSysAdminLoading(false);
      };

      const handleAddWorkshop = async () => {
        const { id, name, icon, color, pin } = newWorkshop;
        if (!id.trim() || !name.trim() || !pin) { showAlert('資料不完整', '請填寫工坊 ID、名稱與初始密碼', 'error'); return; }
        if (!/^[a-z0-9-]+$/.test(id)) { showAlert('格式錯誤', '工坊 ID 只能使用小寫英文、數字、連字號', 'error'); return; }
        setSysAdminLoading(true);
        try {
          await createUserWithEmailAndPassword(adminAuth, id + '@health.local', pin);
          await signOut(adminAuth);
          await setDoc(doc(db, 'artifacts', dbAppId, 'workshop_configs', id), { name, icon, color, active: true, createdAt: new Date().toISOString() });
          showAlert('新增成功', `工坊「${name}」已建立`);
          setNewWorkshop({ id: '', name: '', icon: '🏢', color: '#1e293b', pin: '' });
          loadSysAdminWorkshops();
        } catch(e) {
          await signOut(adminAuth).catch(()=>{});
          showAlert('新增失敗', e.code === 'auth/email-already-in-use' ? '此工坊 ID 已存在' : e.message, 'error');
        }
        setSysAdminLoading(false);
      };

      const handleToggleWorkshop = async (wsId, currentActive) => {
        try {
          await updateDoc(doc(db, 'artifacts', dbAppId, 'workshop_configs', wsId), { active: !currentActive });
          loadSysAdminWorkshops();
        } catch(e) { showAlert('操作失敗', e.message, 'error'); }
      };

      const handleEditWorkshop = async (wsId, updates) => {
        try {
          await updateDoc(doc(db, 'artifacts', dbAppId, 'workshop_configs', wsId), updates);
          showAlert('更新成功', '工坊資料已儲存');
          loadSysAdminWorkshops();
        } catch(e) { showAlert('更新失敗', e.message, 'error'); }
      };

      const submitAdminLogin = async (e) => {
        if (e) e.preventDefault();
        try {
          // 使用獨立次要 app 驗證管理員密碼，不影響當前工坊登入 session
          await signInWithEmailAndPassword(adminAuth, 'admin@health.local', adminPassword);
          await signOut(adminAuth);
          setIsAdmin(true);
          setShowAdminLogin(false);
          showAlert('登入成功', '歡迎進入管理員模式');
        } catch (err) {
          showAlert('登入失敗', '密碼錯誤');
        }
      };

      const handleAddPatientSubmit = async (e) => {
        e.preventDefault();
        if (!newPatient.name || !newPatient.name.trim()) { showAlert("資料不完整", "請填寫「服務對象姓名」", "error"); return; }
        if (!newPatient.birthday) { showAlert("資料不完整", "請選擇「生日」", "error"); return; }
        if (!user) { showAlert("儲存失敗", "尚未連線至資料庫，請檢查網路狀態。", "error"); return; }
        if (isSubmitting || isCompressing) return; 
        
        setIsSubmitting(true);
        try {
          const cleanedMeds = (newPatient.medications || []).map(m => ({
            name: m.name || '', dosage: m.dosage || '', frequency: m.frequency || '', indication: m.indication || '', sideEffects: m.sideEffects || ''
          })).filter(m => m.name.trim() !== '');

          const patientData = await CryptoHelper.encryptPatient({
            name: newPatient.name.trim(), birthday: newPatient.birthday, gender: newPatient.gender || '男', photo: newPatient.photo || null, medications: cleanedMeds, updatedAt: new Date().toISOString()
          });

          const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('網路連線逾時，請檢查連線狀態。')), DB_TIMEOUT_MS));
          
          if (editingPatientId) {
             await Promise.race([updateDoc(doc(db, 'artifacts', dbAppId, workshopId, 'data', 'patients', editingPatientId), patientData), timeoutPromise]);
             showAlert("更新成功", "服務對象資料已成功更新。");
          } else {
             patientData.createdAt = new Date().toISOString();
             await Promise.race([addDoc(collection(db, 'artifacts', dbAppId, workshopId, 'data', 'patients'), patientData), timeoutPromise]);
             showAlert("新增成功", "服務對象資料已加入資料庫。");
          }

          setNewPatient({ name: '', birthday: '', gender: '男', photo: null, medications: [] });
          setEditingPatientId(null); setView('list'); 
        } catch (err) { console.error('submitPatient 失敗:', err); showAlert("儲存失敗", `無法寫入資料庫。\n錯誤訊息：${err.message}`, "error"); } finally { setIsSubmitting(false); }
      };



      // 儲存為下午待量測狀態 (情緒行為鎖定)
      const handleEmotionIssue = (targetId) => {
        if(!targetId) return;
        showConfirm('情緒起伏紀錄', `確定服務對象目前因情緒起伏不適合量測嗎？\n系統將先鎖定，並於「${RECHECK_UNLOCK_LABEL} 後」解鎖再嘗試。`, async () => {
          try {
            await addDoc(collection(db, 'artifacts', dbAppId, workshopId, 'data', 'records'), { 
                patientId: targetId, timestamp: new Date().toISOString(), recordType: 'emotion', status: 'pending_afternoon_emotion' 
            });
            setSelectedPatientId(null); setView('list');
          } catch (err) { console.error('handleEmotionIssue 失敗:', err); handlePermError(err); }
        });
      };

      const saveRecord = async () => {
        if (!user || isSubmitting) return;
        setIsSubmitting(true);
        // 用 helper 取代 `parseFloat(x) || null`：原寫法當輸入 "0" 時 parseFloat 為 0（falsy）會被吃成 null，
        // 雖然血壓/脈搏/體溫不會是 0，但避免將來其他欄位踩雷，統一收斂成 NaN 才轉 null
        const numOrNull = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
        const rec = {
          patientId: selectedPatientId, timestamp: new Date().toISOString(), ...tempRecord,
          systolic: numOrNull(tempRecord.systolic), diastolic: numOrNull(tempRecord.diastolic),
          pulse: numOrNull(tempRecord.pulse), temp: numOrNull(tempRecord.temp),
          weight: numOrNull(tempRecord.weight), height: numOrNull(tempRecord.height)
        };
        try {
          // 在完整走完流程後，判斷是否需要進入下午待量測狀態 (BP高血壓鎖定)
          const hours = currentDate.getHours() + currentDate.getMinutes() / 60;
          // v4.3.14: Number.isFinite 顯式檢查 — 收縮壓留白（null）時不因 null >= 140 轉型比較而靜默跳過鎖定判斷
          const isHighBP = (Number.isFinite(rec.systolic) && rec.systolic >= 140) || (Number.isFinite(rec.diastolic) && rec.diastolic >= 90);

          if (hours < RECHECK_UNLOCK_HOUR && isHighBP && rec.recordType === 'checkin') {
              rec.status = 'pending_afternoon_bp';
              await addDoc(collection(db, 'artifacts', dbAppId, workshopId, 'data', 'records'), rec);
              setSelectedPatientId(null); setView('list');
              showAlert("血壓過高提示", `測得數值高於標準。\n完整紀錄已保留並鎖定，請讓服務對象休息，並於「${RECHECK_UNLOCK_LABEL} 後」再進行解鎖量測。`);
          } else {
              rec.status = 'completed'; // 正常完成狀態
              await addDoc(collection(db, 'artifacts', dbAppId, workshopId, 'data', 'records'), rec);
              setSelectedPatientId(null); setView('list');
          }
        } catch (err) { console.error('Firestore 操作失敗:', err); handlePermError(err); }
        finally { setIsSubmitting(false); }
      };

      const handlePrintRequest = useCallback(() => {
        if (window.parent !== window) {
          showAlert("列印提示", "請點擊預覽區右上角的「在新分頁開啟 (Open in New Window)」圖示，在獨立分頁中列印即可將 PDF 分享至 LINE。");
          return;
        }
        showConfirm("匯出 PDF 並分享", "iPad 教學：\n\n1. 點擊「開始匯出」進入列印介面。\n2. 對著預覽小圖用「兩指張開 (放大)」手勢。\n3. 此時會轉為 PDF 模式，點擊分享按鈕即可傳到 LINE。",
          () => { 
            setDialog({ isOpen: true, title: '處理中...', message: '正在為您產生高畫質報表，請稍候...', type: 'loading', confirmText: '處理中', onConfirm: () => {} });
            setTimeout(() => { window.print(); setTimeout(() => { setDialog(prev => ({ ...prev, isOpen: false })); }, 1000); }, 600);
          }, "開始匯出", "print"
        );
      }, [showConfirm]);

      const handleLeave = (targetId) => {
        if(!targetId) return;
        showConfirm('請假確認', '確定服務對象今天要請假嗎？', async () => {
          try {
            await addDoc(collection(db, 'artifacts', dbAppId, workshopId, 'data', 'records'), { patientId: targetId, timestamp: new Date().toISOString(), recordType: 'leave', status: 'completed' });
            setSelectedPatientId(null); setView('list');
          } catch (err) { console.error('Firestore 操作失敗:', err); handlePermError(err); }
        });
      };

      // v4.3.6: 通用複測提交 — 依 flowType 寫入對應欄位、組合警示訊息
      const handleRecheckSubmit = async (vals, flowType) => {
        const recId = recheckTargetRecordId;
        if (!recId) return;
        const nowIso = new Date().toISOString();
        // 依 flowType 組 payload（不覆蓋原始欄位，全部寫入 *Recheck）
        const payload = { recheckTime: nowIso, status: 'completed' };
        if (flowType === 'bp_only' || flowType === 'both') {
          payload.systolicRecheck = vals.systolic;
          payload.diastolicRecheck = vals.diastolic;
          payload.pulseRecheck = vals.pulse;
        }
        if (flowType === 'pulse_only') {
          payload.pulseRecheck = vals.pulse;
          payload.spo2 = vals.spo2;
        }
        if (flowType === 'both') {
          payload.spo2 = vals.spo2;
        }
        try {
          await updateDoc(doc(db, 'artifacts', dbAppId, workshopId, 'data', 'records', recId), payload);
        } catch(err) {
          console.error('handleRecheckSubmit 失敗:', err);
          showAlert('寫入失敗', `複測資料未能寫入資料庫：${err.message}\n請重新嘗試或檢查網路。`, 'error');
          // 不關閉 Modal，保留 state 供重試
          return;
        }

        // 異常判斷（只看本次複測值；bp_only 不檢查 SpO2）
        const checkBp = (flowType === 'bp_only' || flowType === 'both');
        const checkSpo2 = (flowType === 'pulse_only' || flowType === 'both');
        const bpAbnormal = checkBp && (
          vals.systolic >= 130 || vals.systolic <= 90 ||
          vals.diastolic >= 80 || vals.diastolic <= 60
        );
        const pulseAbnormal = vals.pulse >= 100;
        const spo2Abnormal = checkSpo2 && vals.spo2 !== null && vals.spo2 < 95;

        const abnormalCount = (bpAbnormal ? 1 : 0) + (pulseAbnormal ? 1 : 0) + (spo2Abnormal ? 1 : 0);
        let message = null;
        if (abnormalCount === 1) {
          if (bpAbnormal) {
            // v4.3.14: 依實際值分段 — 高段「仍偏高」、低段「仍偏低」、一高一低用中性「仍異常」並列數值（語彙對齊 getBPWarning 分級）
            const bpHigh = vals.systolic >= 130 || vals.diastolic >= 80;
            const bpLow = vals.systolic <= 90 || vals.diastolic <= 60;
            const bpDesc = (bpHigh && bpLow) ? '仍異常' : bpHigh ? '仍偏高' : '仍偏低';
            message = `⚠ 複測後血壓${bpDesc}（收縮壓 ${vals.systolic} / 舒張壓 ${vals.diastolic}），請持續關注服務對象狀況。`;
          } else if (pulseAbnormal) {
            message = `⚠ 複測後脈搏仍偏高（${vals.pulse} bpm），請持續關注服務對象狀況。`;
          } else if (spo2Abnormal) {
            message = `⚠ 複測後血氧仍偏低（SpO2 ${vals.spo2}%），請持續關注服務對象狀況。`;
          }
        } else if (abnormalCount >= 2) {
          const parts = [];
          if (bpAbnormal) parts.push('血壓');
          if (pulseAbnormal) parts.push('脈搏');
          if (spo2Abnormal) parts.push('血氧');
          message = `⚠ 複測後${parts.join('、')}仍異常，請持續關注服務對象狀況。`;
        }
        if (message) showAlert('複測後提示', message);

        // 成功 → 關閉 Modal、清 target
        setShowPulseRecheck(false);
        setRecheckTargetRecordId(null);
      };

      // v4.3.6: 從卡片開啟複測 Modal 的通用入口
      const openRecheckModal = (record, flowType) => {
        setSelectedPatientId(record.patientId);
        setRecheckTargetRecordId(record.id);
        setRecheckFlowType(flowType);
        setShowPulseRecheck(true);
      };

      const handleCancelLeave = (patientId) => {
        const today = currentDate.toDateString();
        const recordToDelete = records.find(r => r.patientId === patientId && r.recordType === 'leave' && new Date(r.timestamp).toDateString() === today);
        if (recordToDelete) {
          showConfirm('取消請假', '確定要解除服務對象的請假狀態嗎？', async () => {
            try { await deleteDoc(doc(db, 'artifacts', dbAppId, workshopId, 'data', 'records', recordToDelete.id)); } catch (err) { console.error('Firestore 操作失敗:', err); handlePermError(err); }
          });
        }
      };

      const addMedication = () => {
        const newIndex = (newPatient.medications || []).length;
        setNewPatient(prev => ({ ...prev, medications: [...(prev.medications || []), { name: '', dosage: '', frequency: '', indication: '', sideEffects: '' }] }));
        // 新增後立刻打開選藥視窗
        setTimeout(() => setDrugPickerIndex(newIndex), 50);
      };
      const removeMedication = (index) => {
        setNewPatient(prev => ({ ...prev, medications: (prev.medications || []).filter((_, i) => i !== index) }));
      };
      const updateMedication = (index, field, value) => {
        // 不直接 mutate meds[index][field]，改用 spread 避免 React 認不出 reference 變化（雖然外層 medications 是新陣列，但 row 物件仍是原參考，DevTools/StrictMode 下行為不一致）
        setNewPatient(prev => ({
          ...prev,
          medications: (prev.medications || []).map((m, i) => i === index ? { ...m, [field]: value } : m)
        }));
      };

      // 從選藥視窗選定藥物後，帶入三欄資料
      const handleDrugSelected = (drug) => {
        const meds = [...(newPatient.medications || [])];
        if (drugPickerIndex !== null && meds[drugPickerIndex] !== undefined) {
          meds[drugPickerIndex] = { ...meds[drugPickerIndex], name: drug.name, indication: drug.indication || '', sideEffects: drug.sideEffects || '' };
          setNewPatient(prev => ({ ...prev, medications: meds }));
        }
        setDrugPickerIndex(null);
      };

      // 從選藥視窗新增新藥到雲端資料庫
      const handleAddDrugFromPicker = async (drug) => {
        if (!user || !drug.name) return;
        try {
          await addDoc(collection(db, 'artifacts', dbAppId, workshopId, 'data', 'medications'), drug);
        } catch (err) { console.error('Firestore 操作失敗:', err); handlePermError(err); }
      };

      // 從選藥視窗更新藥物資料
      const handleUpdateDrugFromPicker = async (drugId, data) => {
        if (!user || !drugId) return;
        try {
          await updateDoc(doc(db, 'artifacts', dbAppId, workshopId, 'data', 'medications', drugId), data);
        } catch (err) { console.error('Firestore 操作失敗:', err); handlePermError(err); }
      };

      // 從選藥視窗刪除藥物
      const handleDeleteDrugFromPicker = async (drugId) => {
        if (!user || !drugId) return;
        try {
          await deleteDoc(doc(db, 'artifacts', dbAppId, workshopId, 'data', 'medications', drugId));
        } catch (err) { console.error('Firestore 操作失敗:', err); handlePermError(err); }
      };

      const startWizard = () => {
        setTempRecord({ temp: '', systolic: '', diastolic: '', pulse: '', mood: 'happy', recordType: 'checkin', weight: '', height: '', status: 'completed' });
        setWizardStep(0); setView('wizard');
      };

      const startWeightInput = () => {
        setTempRecord({ weight: '', height: '', recordType: 'weight', temp: '', systolic: '', diastolic: '', pulse: '', mood: '', status: 'completed' });
        setWizardStep('weight'); setView('wizard');
      };

      const renderPatientList = () => {
        // ── 今日進度統計 ──
        const today = currentDate.toDateString();
        const hours = currentDate.getHours() + currentDate.getMinutes() / 60;
        const totalCount = patients.length;
        const currentYearMonthProg = currentDate.toISOString().slice(0, 7);
        const doneCount = patients.filter(patient => {
          const todayRecs = records.filter(r => r.patientId === patient.id && new Date(r.timestamp).toDateString() === today);
          todayRecs.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
          const rec = todayRecs.find(r => r.recordType !== 'weight') ?? null;
          if (!rec) return false;
          if (rec.status === 'completed') return true;
          if (rec.status === 'pending_afternoon_emotion' && hours >= FORCE_SETTLE_HOUR) return true;
          if (rec.status === 'pending_afternoon_bp' && hours >= FORCE_SETTLE_HOUR) return true;
          return false;
        }).length;
        const weightDoneCount = isQuarterEnd ? patients.filter(patient =>
          records.some(r => r.patientId === patient.id && r.recordType === 'weight' && r.status === 'completed' && r.timestamp?.startsWith(currentYearMonthProg))
        ).length : 0;
        const progressPct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
        const weightProgressPct = totalCount > 0 ? Math.round((weightDoneCount / totalCount) * 100) : 0;
        const allDone = doneCount === totalCount && totalCount > 0 && (!isQuarterEnd || weightDoneCount === totalCount);

        // ── 昨日血壓異常 badge ──
        const yesterday = new Date(currentDate); yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toDateString();
        const getBPWarning = (patientId) => {
          // v4.3.12: pending_afternoon_bp（早上血壓偏高被鎖定、未複測）也納入 — 原本只認 completed，反而漏掉最需要警示的人
          const yRecs = records.filter(r => r.patientId === patientId && new Date(r.timestamp).toDateString() === yesterdayStr && (r.status === 'completed' || r.status === 'pending_afternoon_bp') && r.systolic);
          if (yRecs.length === 0) return null;
          const latest = yRecs.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp))[0];
          // v4.3.14: 套「複測優先」— 初測偏高但複測降回正常者不再誤顯警告，與報表判斷一致
          const sys = pickRecheck(latest, 'systolic');
          const dia = pickRecheck(latest, 'diastolic');
          if (sys >= 160 || dia >= 100) return { level: 2, label: '⚠️ 昨日血壓很高' };
          if (sys >= 140 || dia >= 90) return { level: 1, label: '⚠️ 昨日血壓偏高' };
          if (sys < 90 || dia < 60) return { level: 0, label: '⚠️ 昨日血壓偏低' };
          return null;
        };

        return (
        <div className="flex flex-col items-center w-full animate-in fade-in duration-300">

          {/* ── 進度條區塊（含早安提示）；v4.3.12: 首批快照未到前隱藏，避免顯示「0/0 人」 ── */}
          {patientsLoaded && (
          <div className="w-full max-w-7xl px-4 mb-2 mt-2">
            <div style={{background: 'white', borderRadius: '10px', border: '1px solid var(--soft-gray)', boxShadow: 'var(--shadow-card)', padding: '10px 20px', display: 'flex', alignItems: 'center', gap: '16px'}}>
              <div style={{flex: 1}}>
                {/* 每日量測進度 — 文字+圖示+進度條 同一行 */}
                <div style={{display: 'flex', alignItems: 'center', gap: '12px'}}>
                  {/* 左：標籤 */}
                  <div style={{flexShrink: 0}}>
                    <span style={{fontWeight: 700, fontSize: '15px', color: 'var(--charcoal)'}}>每日量測進度</span>
                    {!isAdmin && (
                      <span style={{display: 'block', marginTop: '2px', fontWeight: 500, fontSize: '11px', color: 'var(--subtle-ash)'}}>請點選服務對象卡片開始量測</span>
                    )}
                  </div>
                  {/* 中：血壓計圖示 + 進度條 */}
                  <div style={{flex: 1}}>
                    <div style={{position: 'relative', height: '32px', marginBottom: '3px'}}>
                    <div style={{
                      position: 'absolute',
                      bottom: 0,
                      left: `calc(${Math.min(Math.max(progressPct, 0), 95)}% - 16px)`,
                      transition: 'left 0.7s cubic-bezier(0.34, 1.56, 0.64, 1)',
                      width: '32px',
                      height: '32px',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      background: 'white',
                      borderRadius: '50%',
                      border: `2px solid ${doneCount === totalCount && totalCount > 0 ? '#10b981' : 'var(--brand)'}`,
                      boxSizing: 'border-box',
                      boxShadow: '0 2px 8px rgba(0,0,0,0.10)'
                    }}>
                    <BloodPressureIcon size={16} />
                    </div>
                    </div>
                    {/* 下方進度條行 */}
                    <div style={{position: 'relative', height: '6px'}}>
                      <div style={{position: 'absolute', inset: 0, background: '#f0ede9', borderRadius: '99px'}} />
                      <div style={{
                        position: 'absolute',
                        top: 0, left: 0, bottom: 0,
                        width: `${Math.min(progressPct, 100)}%`,
                        background: doneCount === totalCount && totalCount > 0 ? '#10b981' : 'var(--brand)',
                        borderRadius: '99px',
                        transition: 'width 0.7s ease'
                      }} />
                    </div>
                  </div>
                  {/* 右：人數計數 */}
                  <span style={{fontWeight: 800, fontSize: '17px', color: doneCount === totalCount && totalCount > 0 ? '#059669' : 'var(--charcoal)', flexShrink: 0}}>
                    {doneCount}<span style={{fontWeight: 600, fontSize: '13px', color: 'var(--subtle-ash)'}}> / {totalCount} 人</span>
                  </span>
                </div>

                {/* 身體量測進度（量測週才顯示） */}
                {isQuarterEnd && (
                  <>
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginTop: '12px', marginBottom: '8px'}}>
                      <span style={{fontWeight: 700, fontSize: '13px', color: '#2563eb', display: 'flex', alignItems: 'center', gap: '4px'}}>
                        <Scale size={13} style={{display: 'inline'}}/>本月身體量測
                      </span>
                      <span style={{fontWeight: 800, fontSize: '15px', color: weightDoneCount === totalCount && totalCount > 0 ? '#059669' : '#2563eb'}}>
                        {weightDoneCount}<span style={{fontWeight: 600, fontSize: '13px', color: 'var(--subtle-ash)'}}> / {totalCount} 人</span>
                      </span>
                    </div>
                    <div style={{width: '100%', height: '6px', background: '#f0ede9', borderRadius: '99px', overflow: 'hidden'}}>
                      <div style={{height: '6px', borderRadius: '99px', transition: 'width 0.7s ease', width: `${weightProgressPct}%`, background: weightDoneCount === totalCount && totalCount > 0 ? '#10b981' : '#3b82f6'}} />
                    </div>
                  </>
                )}
              </div>

              {/* 全部完成標誌 */}
              {allDone && (
                <div style={{flexShrink: 0, textAlign: 'center', padding: '8px 12px', background: '#f0fdf4', borderRadius: '10px', border: '1px solid #a7f3d0'}}>
                  <div style={{fontSize: '22px', lineHeight: 1}}>🎉</div>
                  <div style={{fontSize: '10px', fontWeight: 800, color: '#059669', marginTop: '4px'}}>全部完成</div>
                </div>
              )}
            </div>
          </div>
          )}

          {/* ── 學員卡片 Grid；v4.3.12: 載入中/金鑰失敗/空清單三狀態可見化 ── */}
          <div className="max-w-7xl w-full px-4 pb-10 mx-auto">
            {cryptoInitError ? (
              <div className="bg-red-50 border border-red-200 rounded-2xl px-6 py-8 mt-4 max-w-lg mx-auto">
                <AlertCircle className="w-10 h-10 text-red-500 mx-auto mb-3" />
                <p className="font-bold text-red-700 mb-1">系統初始化失敗</p>
                <p className="text-sm text-slate-600 mb-4">加密金鑰未就緒，無法載入資料。（{cryptoInitError}）</p>
                <button onClick={() => { setCryptoInitError(''); setRetryNonce(n => n + 1); }} className="px-8 py-3 bg-red-600 text-white font-bold rounded-xl active:scale-95 transition-transform">重試</button>
              </div>
            ) : !patientsLoaded ? (
              <div className="flex flex-col items-center justify-center py-16 text-slate-400">
                <Loader2 className="w-10 h-10 animate-spin mb-3" />
                <p className="font-bold">資料載入中…</p>
              </div>
            ) : patients.length === 0 ? (
              <p className="py-16 font-bold text-slate-400">尚無學員</p>
            ) : (
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
              {patients.map(patient => {
                const todayRecords = records.filter(r => r.patientId === patient.id && new Date(r.timestamp).toDateString() === today);
                todayRecords.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                const latestRec = todayRecords.find(r => r.recordType !== 'weight') ?? null;
                const bpWarning = getBPWarning(patient.id);

                const currentYearMonth = currentDate.toISOString().slice(0, 7);
                const isMonthlyWeightDone = records.some(r =>
                    r.patientId === patient.id &&
                    r.recordType === 'weight' &&
                    r.status === 'completed' &&
                    r.timestamp?.startsWith(currentYearMonth)
                );

                let state = 'unmeasured';
                if (latestRec) {
                    if (latestRec.status === 'completed') {
                        if (latestRec.recordType === 'leave') state = 'leave';
                        else state = 'completed';
                    } else if (latestRec.status === 'pending_afternoon_bp' || latestRec.status === 'pending_afternoon_emotion') {
                        // v4.3.5: BP 解鎖時間統一為 11:00（原 13:30）；FORCE_SETTLE_HOUR（17:30）後強制結算收斂
                        if (hours < RECHECK_UNLOCK_HOUR) {
                            state = 'locked_morning';
                        } else if (hours >= RECHECK_UNLOCK_HOUR && hours < FORCE_SETTLE_HOUR) {
                            state = 'ready_retest';
                        } else {
                            state = latestRec.status === 'pending_afternoon_emotion' ? 'emotion_final' : 'completed';
                        }
                    }
                }

                const isCompleted = state === 'completed';
                const isLeave = state === 'leave';
                const isLockedMorning = state === 'locked_morning';
                const isReadyRetest = state === 'ready_retest';
                const isEmotionFinal = state === 'emotion_final';
                const needsWeightMeasurement = isQuarterEnd && (isCompleted || isEmotionFinal) && !isMonthlyWeightDone;

                // 脈搏複測計算（card scope，供 overlay 與 click handler 共用）
                // v4.3.5: 解鎖條件由「初測+60 分鐘」改為「現在 ≥ 11:00」（與 BP 鎖定解鎖時間統一）
                const canPulseRecheck = !!(latestRec && latestRec.pulse >= 100 && !latestRec.pulseRecheck);
                const pulseRecheckUnlocked = hours >= RECHECK_UNLOCK_HOUR;
                const hadHighPulse = !!(latestRec && latestRec.pulse >= 100);

                // 卡片狀態對應的視覺樣式
                const cardStateClass = isReadyRetest
                  ? 'patient-card patient-card--retest'
                  : (isCompleted || isEmotionFinal)
                    ? 'patient-card patient-card--locked'
                    : isLeave
                      ? 'patient-card patient-card--leave'
                      : isLockedMorning
                        ? 'patient-card patient-card--locked'
                        : 'patient-card';

                // 狀態色條（頂部細線，取代 border-left）
                const stateBarColor = isLeave
                  ? '#94a3b8'
                  : isReadyRetest || isLockedMorning
                    ? 'var(--brand)'
                    : isEmotionFinal
                      ? '#a855f7'
                      : isCompleted
                        ? '#10b981'
                        : 'var(--brand)';

                return (
                  <div
                    key={patient.id}
                    className={cardStateClass}
                    style={{cursor: isLeave ? 'default' : 'pointer', position: 'relative'}}
                    onClick={() => {
                      if (isLeave) return;
                      // v4.3.6: 可複測狀態 → 點卡片直接開 Modal，不再進詳情頁
                      if (isReadyRetest) {
                        // BP 解鎖中：依「是否同時有高脈搏」決定 4 步合併或 3 步 BP
                        openRecheckModal(latestRec, canPulseRecheck ? 'both' : 'bp_only');
                        return;
                      }
                      if (isLockedMorning || isCompleted || isEmotionFinal) {
                          if (isAdmin) { setSelectedPatientId(patient.id); setView('detail'); }
                          // v4.3.8: 脈搏異常複測為醫療異常追蹤項，優先級高於季末身體量測（後者整月可做）；原本順序在月底會被 needsWeightMeasurement 攔截到詳情頁，導致詳情頁 weightOnlyMode 鎖掉複測入口
                          else if (canPulseRecheck) {
                              if (pulseRecheckUnlocked) {
                                  // 只脈搏複測（completed + 脈搏異常未複測 + 11:00 後）
                                  openRecheckModal(latestRec, 'pulse_only');
                              } else {
                                  showAlert("脈搏待複測", `初測脈搏偏高（${latestRec.pulse} 下/分），請讓服務對象休息。\n${RECHECK_UNLOCK_LABEL} 後可進行血氧機複測。`);
                              }
                          }
                          else if (needsWeightMeasurement) { setSelectedPatientId(patient.id); setView('detail'); }
                          else if (isLockedMorning) {
                              showAlert("量測鎖定中", `請讓服務對象休息，並於「${RECHECK_UNLOCK_LABEL} 後」再來進行血壓複測喔！`);
                          } else {
                              showAlert("今日已完成", "今天的紀錄已經結算鎖定囉！");
                          }
                          return;
                      }
                      setSelectedPatientId(patient.id);
                      setView('detail');
                    }}
                  >
                    {/* 頂部狀態色條 */}
                    <div style={{height: '3px', background: stateBarColor, width: '100%'}} />

                    {/* 照片區 */}
                    <div style={{position: 'relative', paddingTop: '100%', background: '#f0ede9'}}>
                      {patient.photo
                        ? <img src={patient.photo} style={{position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover'}} alt={patient.name} />
                        : <div style={{position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', background:'#e8e4e0', color:'#94928f'}}><User size={36}/></div>
                      }

                      {/* 完成 overlay */}
                      {isCompleted && !canPulseRecheck && (
                        <div style={{position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', background:'rgba(30,26,22,0.45)', backdropFilter:'blur(1px)', pointerEvents:'none', zIndex:10, color:'white'}}>
                          <Lock size={28} style={{marginBottom:'6px', filter:'drop-shadow(0 2px 4px rgba(0,0,0,0.4))'}}/>
                          <span style={{fontSize:'11px', fontWeight:800, padding:'3px 10px', borderRadius:'99px', background: isQuarterEnd && isMonthlyWeightDone ? '#059669' : needsWeightMeasurement ? '#2563eb' : '#059669', boxShadow:'0 2px 8px rgba(0,0,0,0.3)', whiteSpace:'nowrap'}}>
                            {isQuarterEnd && isMonthlyWeightDone ? '每日＋身體完成 ✓' : needsWeightMeasurement ? '需要身體量測' : '今日量測完畢'}
                          </span>
                        </div>
                      )}
                      {isCompleted && canPulseRecheck && (
                        <div style={{position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', background:'rgba(120,60,10,0.38)', backdropFilter:'blur(1px)', pointerEvents:'none', zIndex:10, color:'white'}}>
                          <Clock size={28} style={{marginBottom:'6px', filter:'drop-shadow(0 2px 4px rgba(0,0,0,0.4))', animation:'pulse 2s infinite'}}/>
                          <span style={{fontSize:'13px', fontWeight:800, padding:'4px 12px', borderRadius:'99px', background:'var(--brand)', boxShadow:'0 2px 8px rgba(0,0,0,0.25)', whiteSpace:'nowrap'}}>
                            {pulseRecheckUnlocked ? '❤ 可複測脈搏' : `${RECHECK_UNLOCK_LABEL} 後可複測脈搏`}
                          </span>
                        </div>
                      )}

                    if (dayRecords.length === 0) return { date: day };

                    const latest = dayRecords[dayRecords.length - 1];
                    const rDate = new Date(latest.timestamp);
                    const isPastDay = rDate.toDateString() !== currentDate.toDateString();
                    const hours = currentDate.getHours() + currentDate.getMinutes() / 60;

                    if (latest.status === 'pending_afternoon_bp' || latest.status === 'pending_afternoon_emotion') {
                        // 如果是歷史紀錄，或是今天過了 FORCE_SETTLE_HOUR（17:30），強制視為完成狀態並顯示在報表中
                        if (isPastDay || hours >= FORCE_SETTLE_HOUR) {
                            return { ...latest, date: day, status: 'completed' };

                            return { date: day };
