                                                    <td className={`px-3 py-2 print:px-1 print:py-[2px] text-center font-normal text-sm print:text-[10px] print:leading-tight ${getSystolicStyle(pickRecheck(d, 'systolic'))}`}>{d.systolic ? (d.systolicRecheck ? `${d.systolic}/${d.systolicRecheck}` : `${d.systolic}`) : (d.systolicRecheck ? `${d.systolicRecheck}` : '-')}</td>
                                                    <td className={`px-3 py-2 print:px-1 print:py-[2px] text-center font-normal text-sm print:text-[10px] print:leading-tight ${getDiastolicStyle(pickRecheck(d, 'diastolic'))}`}>{d.diastolic ? (d.diastolicRecheck ? `${d.diastolic}/${d.diastolicRecheck}` : `${d.diastolic}`) : (d.diastolicRecheck ? `${d.diastolicRecheck}` : '-')}</td>
                                                    <td className={`px-3 py-2 print:px-1 print:py-[2px] text-center font-normal text-sm print:text-[10px] print:leading-tight ${(pickRecheck(d, 'pulse') >= 100) ? 'text-red-600 bg-[#fff1f2]' : 'text-slate-700'}`}>{d.pulse ? (d.pulseRecheck != null ? `${d.pulse}/${d.pulseRecheck}` : `${d.pulse}`) : (d.pulseRecheck != null ? `${d.pulseRecheck}` : '-')}</td>
                                                    <td className={`px-3 py-2 print:px-1 print:py-[2px] text-center font-normal text-sm print:text-[10px] print:leading-tight ${d.spo2 != null && d.spo2 < 95 ? 'text-red-600' : 'text-slate-700'}`}>{d.spo2 != null ? `${d.spo2}%` : '—'}</td>
                                                    <td className="px-3 py-2 print:px-1 print:py-[2px] text-center text-lg print:text-[12px] text-slate-700 print:leading-tight">{d.mood === 'happy' && '😄'}{d.mood === 'neutral' && '😐'}{d.mood === 'sad' && '😢'}</td>
                                                </>
                                            )}
                                        </tr>
                                    );
                                })}
                            </tbody>
                            </table>
                        </div>
                    </div>
                );

                return (
                  <div key={patient.id} className="report-patient-block bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                    {/* 上半月頁面 */}
                    <div className="report-first-page print:block">
                        <div className="flex flex-col md:flex-row items-center justify-between border-b-2 border-slate-100 pb-6 mb-4 text-center print:flex-row print:text-left md:text-left print:pb-1 print:mb-2">
                        <div className="flex flex-col md:flex-row items-center print:flex-row print:space-x-4 md:space-x-6">
                            <div>
                            <h3 className="text-3xl print:text-xl font-normal text-slate-800">{String(patient.name)} <span className="text-sm text-slate-500 font-normal print:inline hidden ml-2">(上半月紀錄)</span></h3>
                            <p className="text-slate-500 font-normal mt-1 print:mt-0 text-sm print:text-[10pt]">{patient.gender} | {calculateAge(patient.birthday)} 歲 | {reportMonth} 報告</p>
                            </div>
                        </div>
                        {isAdmin && (
                          <button
                            onClick={() => setEditRecordsPatientId(patient.id)}
                            className="print:hidden flex items-center gap-1 text-xs text-slate-400 hover:text-slate-600 bg-slate-50 hover:bg-slate-100 px-2 py-1 rounded-lg transition-colors"
                          >
                            <Pencil size={13} /> 編輯記錄
                          </button>
                        )}
                        </div>

                        {/* v4.3.15: 顯式 Array.isArray — 解密失敗筆可能帶非陣列 medications，防禦 .map 炸開 */}
                        {Array.isArray(patient.medications) && patient.medications.length > 0 && (
                        <div className="report-med-block mb-4 print:mb-1 border-b-2 border-slate-100 pb-4 print:pb-1">
                            <h4 className="text-base print:text-[10pt] font-normal text-slate-700 mb-3 print:mb-1 flex items-center"><Pill className="w-5 h-5 print:w-3.5 print:h-3.5 mr-2 text-emerald-500"/> 服務對象目前用藥與副作用</h4>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 print:grid-cols-4 gap-3 print:gap-[3pt]">
                            {patient.medications.map((m, i) => (
                                <div key={i} className="med-card bg-slate-50 print:bg-white p-3 print:p-[4pt] rounded-xl border border-slate-200 flex flex-col justify-start break-inside-avoid shadow-sm print:shadow-none print:border-slate-300 print:overflow-hidden">
                                    <div className="flex flex-col gap-0.5 print:gap-0 mb-1 print:mb-0">
                                    <span className="med-name font-medium text-slate-700 text-sm leading-tight text-left">{m.name}</span>
                                    {(m.dosage || m.frequency) && (
                                        <span className="med-dosage text-[10px] font-normal text-slate-500 leading-snug">{m.dosage}{m.dosage && m.frequency ? '｜' : ''}{m.frequency}</span>
                                    )}
                                    </div>
                                    <div className="flex-1 space-y-0.5 print:space-y-0 mt-1 print:mt-[2pt] text-left">
                                    {m.indication && <div className="med-indication text-slate-600 text-xs leading-snug"><span className="font-normal text-slate-500 mr-1">適應症:</span>{m.indication}</div>}
                                    {m.sideEffects && <div className="med-sideeffects text-red-500 text-xs leading-snug"><span className="font-normal text-red-400 mr-1">副作用:</span>{m.sideEffects}</div>}
                                    </div>
                                </div>
                            ))}
                            </div>
                        </div>
                        )}

                        {/* 傳入 true，表示是上半月，系統會自動在血壓圖下方附加身高體重年度圖表 */}
                        {renderChartAndTable(firstHalfData, true)}
                    </div>

                    {/* 下半月頁面 (強制換頁) */}
                    <div className="report-second-page pt-8">
                        <div className="border-b-2 border-slate-100 pb-2 mb-4 text-left">
                           <h3 className="text-xl font-normal text-slate-800">服務對象：{String(patient.name)} <span className="text-sm text-slate-500 font-normal">(下半月紀錄)</span></h3>
                        </div>
                        {/* 傳入 false，下半月區塊不再重複繪製年度圖表，節省空間 */}
                        {renderChartAndTable(secondHalfData, false)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      const renderWizard = () => {
        const getFieldData = () => {
           if (wizardStep === 'weight') return { label: '目前體重', unit: 'kg', icon: Scale, color: 'text-blue-500', field: 'weight' };
           if (wizardStep === 'height') return { label: '目前身高', unit: 'cm', icon: Ruler, color: 'text-indigo-500', field: 'height' };
           // 變更順序：步驟0為體溫，步驟1收縮，步驟2舒張，步驟3脈搏
           if (wizardStep === 0) return { label: '體溫', unit: '°C', icon: Thermometer, color: 'text-orange-500', field: 'temp' };
           if (wizardStep === 1) return { label: '收縮壓', unit: 'mmHg', icon: Activity, color: 'text-red-500', field: 'systolic' };
           if (wizardStep === 2) return { label: '舒張壓', unit: 'mmHg', icon: Activity, color: 'text-red-400', field: 'diastolic' };
           if (wizardStep === 3) return { label: '脈搏', unit: 'BPM', icon: Heart, color: 'text-rose-500', field: 'pulse' };
           return {};
        };

        const handleNextStep = () => {
           if (wizardStep === 'weight') {
               const v = parseFloat(tempRecord.weight);
               if (v < 20 || v > 300) { showAlert("數值異常", "體重輸入異常，請輸入 20 ~ 300 之間的合理數值 (kg)。", "error"); return; }
               setWizardStep('height');
           }
           else if (wizardStep === 'height') {
               const v = parseFloat(tempRecord.height);
               if (v < 50 || v > 250) { showAlert("數值異常", "身高輸入異常，請輸入 50 ~ 250 之間的合理數值 (cm)。", "error"); return; }
               saveRecord();
           }
           else if (wizardStep === 0) { // Temp
               const v = parseFloat(tempRecord.temp);
               if (v < 32 || v > 45) { showAlert("數值異常", "體溫輸入異常，請輸入 32 ~ 45 之間的合理數值 (°C)。", "error"); return; }
               setWizardStep(1); 
           }
           else if (wizardStep === 1) { // Sys
               const v = parseFloat(tempRecord.systolic);
               if (v < 50 || v > 300) { showAlert("數值異常", "收縮壓輸入異常，請輸入 50 ~ 300 之間的合理數值 (mmHg)。", "error"); return; }
               setWizardStep(2); 
           }
           else if (wizardStep === 2) { // Dia
               const sys = parseFloat(tempRecord.systolic);
               const dia = parseFloat(tempRecord.diastolic);
               if (dia < 30 || dia > 200) { showAlert("數值異常", "舒張壓輸入異常，請輸入 30 ~ 200 之間的合理數值 (mmHg)。", "error"); return; }
               if (dia >= sys) { showAlert("防呆機制攔截", "舒張壓不可大於或等於收縮壓，請重新確認數值。", "error"); return; }
               setWizardStep(3); 
           }
           else if (wizardStep === 3) { // Pulse
               const v = parseFloat(tempRecord.pulse);
               if (v < 30 || v > 300) { showAlert("數值異常", "脈搏輸入異常，請輸入 30 ~ 300 之間的合理數值 (BPM)。", "error"); return; }
               setWizardStep(4); 
           }
        };

        if (wizardStep === 4) {
          return (
            <div className="fixed inset-0 bg-orange-50 z-50 flex flex-col overflow-hidden">
              <div className="flex justify-start p-4 md:p-6">
                <button onClick={() => { setView('detail'); }} className="p-3 md:p-4 bg-white shadow-md border border-slate-100 rounded-full active:scale-90 transition-transform"><X className="w-6 h-6 md:w-8 md:h-8 text-slate-500"/></button>
              </div>
              <div className="flex-1 text-center max-w-4xl mx-auto w-full flex flex-col items-center justify-center pb-20 px-6 md:px-12">
                 <h2 className="text-2xl md:text-3xl font-bold mb-6 md:mb-10 text-slate-800">最後一步：今天服務對象心情如何？</h2>
                 <div className="grid grid-cols-3 gap-3 md:gap-6 w-full max-w-3xl">
                    <button onClick={() => setTempRecord({...tempRecord, mood: 'happy'})} className={`p-4 md:p-6 rounded-2xl md:rounded-[2.5rem] transition-all flex flex-col items-center border-4 ${tempRecord.mood === 'happy' ? 'bg-yellow-100 border-yellow-400 ring-4 md:ring-8 ring-yellow-400/50 scale-105 shadow-xl' : 'bg-yellow-50 border-yellow-100 opacity-70 shadow-sm'}`}>
                      <span className="text-6xl md:text-8xl mb-2 md:mb-4 leading-none">😄</span>
                      <span className="font-black text-xl md:text-3xl text-yellow-600">開心</span>
                    </button>
                    <button onClick={() => setTempRecord({...tempRecord, mood: 'neutral'})} className={`p-4 md:p-6 rounded-2xl md:rounded-[2.5rem] transition-all flex flex-col items-center border-4 ${tempRecord.mood === 'neutral' ? 'bg-slate-100 border-slate-400 ring-4 md:ring-8 ring-slate-400/50 scale-105 shadow-xl' : 'bg-slate-50 border-slate-100 opacity-70 shadow-sm'}`}>
                      <span className="text-6xl md:text-8xl mb-2 md:mb-4 leading-none">😐</span>
                      <span className="font-black text-xl md:text-3xl text-slate-500">普通</span>
                    </button>
                    <button onClick={() => setTempRecord({...tempRecord, mood: 'sad'})} className={`p-4 md:p-6 rounded-2xl md:rounded-[2.5rem] transition-all flex flex-col items-center border-4 ${tempRecord.mood === 'sad' ? 'bg-indigo-100 border-indigo-400 ring-4 md:ring-8 ring-indigo-400/50 scale-105 shadow-xl' : 'bg-indigo-50 border-indigo-100 opacity-70 shadow-sm'}`}>
                      <span className="text-6xl md:text-8xl mb-2 md:mb-4 leading-none">😢</span>
                      <span className="font-black text-xl md:text-3xl text-indigo-500">不開心</span>
                    </button>
                 </div>
                 <button onClick={saveRecord} className="w-full max-w-2xl py-5 md:py-6 bg-gradient-to-r from-orange-400 to-rose-400 text-white rounded-full font-black text-xl md:text-3xl mt-8 md:mt-12 shadow-xl shadow-orange-200 active:scale-95 active:translate-y-1 flex items-center justify-center transition-all border-b-6 md:border-b-8 border-orange-500 active:border-b-0 hover:from-orange-500"><CheckCircle className="mr-3 w-6 h-6 md:w-8 md:h-8"/> 儲存並結束量測</button>
              </div>
            </div>
          );
        }

        const data = getFieldData();

        return (
          <div className="fixed inset-0 bg-orange-50 z-50 flex flex-col overflow-hidden">
            <div className="flex justify-start p-4 md:p-6">
              <button onClick={() => { setView('detail'); }} className="p-3 bg-white shadow-md border border-slate-100 rounded-full active:scale-90 transition-transform"><X className="w-6 h-6 text-slate-500"/></button>
            </div>
            <div className="flex-1 w-full overflow-y-auto px-4 pb-6">
               <NumpadInputComponent label={data.label} unit={data.unit} icon={data.icon} color={data.color} value={tempRecord[data.field]} onChange={v => setTempRecord({...tempRecord, [data.field]: v})} onConfirm={handleNextStep} />
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen font-inter text-slate-800 selection:bg-orange-100" style={{backgroundColor: 'var(--paper)'}}>
          <header className="sticky top-0 z-40 print:hidden list-header-brand" style={{backgroundColor: 'var(--paper)', borderBottom: '1px solid var(--soft-gray)'}}>
            <div className="max-w-7xl mx-auto px-4 h-[88px] flex items-center justify-between gap-3">
              {/* 想放自己的 logo？把下面這段的註解拿掉，換成你的檔名（README「換 logo」段有提示詞）
              <div className="flex items-center gap-3 cursor-pointer select-none flex-shrink-0" onClick={() => setView('list')}>
                <img
                  src="assets/你的logo.png"
                  alt="健康站 Logo"
                  style={{height: '52px', width: 'auto', flexShrink: 0}}
                  onError={e => { e.target.style.display='none'; }}
                />
              </div>
              */}
              {/* 標題 — 三段 flex 中段，平板直向不再被擠壓覆蓋 */}
              <div
                className="cursor-pointer select-none flex-1 min-w-0 flex justify-center"
                onClick={() => setView('list')}
              >
                <div style={{position: 'relative', display: 'inline-block', whiteSpace: 'nowrap'}}>
                  <h1 style={{fontSize: 'clamp(20px, 3.2vw, 32px)', fontWeight: 600, fontFamily: "'JasonHandwriting2', 'Noto Serif TC', serif", color: 'var(--charcoal)', lineHeight: 1.3, margin: 0}}>
                    {appName}
                  </h1>
                  <span style={{position: 'absolute', right: '-2px', bottom: '-10px', fontSize: '9px', fontWeight: 600, fontFamily: "'Inter', sans-serif", color: '#9ca3af'}}>{CHANGELOG[0].version}</span>
                </div>
              </div>
              {/* 右側操作區 */}
              <div className="flex items-center gap-2 flex-shrink-0">
                {isAdmin && (
                  <>
                    <button onClick={() => setView('report')} className="hidden md:flex items-center font-bold px-4 py-2 transition-all" style={{color: 'var(--subtle-ash)', background: '#f3f2f0', borderRadius: '15px', fontSize: '15px', border: '1px solid var(--soft-gray)'}}>
                      <FileText size={16} className="mr-1.5" />報表
                    </button>
                    <button onClick={() => { setEditingPatientId(null); setNewPatient({ name: '', birthday: '', gender: '男', photo: null, medications: [] }); setView('add-patient'); }} className="hidden lg:flex items-center font-bold transition-all header-btn-brand" style={{fontSize: '15px', padding: '10px 20px'}}>
                      <Plus size={16} className="mr-1.5" />服務對象
                    </button>
                    <button onClick={() => setShowChangelog(true)} className="hidden md:flex items-center font-bold px-4 py-2 transition-all" style={{color: 'var(--subtle-ash)', background: '#f3f2f0', borderRadius: '15px', fontSize: '15px', border: '1px solid var(--soft-gray)'}}>
                      <Clock size={16} className="mr-1.5" />版本紀錄
                    </button>
                    <button onClick={() => setShowTrash(true)} className="hidden md:flex items-center font-bold px-4 py-2 transition-all" style={{color: 'var(--subtle-ash)', background: '#f3f2f0', borderRadius: '15px', fontSize: '15px', border: '1px solid var(--soft-gray)'}}>
                      <Trash2 size={16} className="mr-1.5" />垃圾桶 ({trashedPatients.length})
                    </button>
                    {/* v4.3.15: 舊明文用藥清單補加密 — 無待處理筆數時不顯示 */}
                    {plainMedsPatients.length > 0 && (
                      <button onClick={() => showConfirm('補加密用藥資料', `將把 ${plainMedsPatients.length} 位服務對象的明文用藥清單改為加密儲存，此動作不可復原。請確認此時無人正在編輯服務對象資料。確定執行？`, backfillMedsEncryption)} disabled={isBackfilling} className="hidden md:flex items-center font-bold px-4 py-2 transition-all disabled:opacity-50" style={{color: 'var(--subtle-ash)', background: '#f3f2f0', borderRadius: '15px', fontSize: '15px', border: '1px solid var(--soft-gray)'}}>
                        <Lock size={16} className="mr-1.5" />補加密用藥資料 ({plainMedsPatients.length})
                      </button>
                    )}
                  </>
                )}
                <button onClick={toggleAdminLogin} className="flex items-center font-bold transition-all" style={isAdmin ? {color: '#dc2626', background: '#fef2f2', borderRadius: '15px', fontSize: '15px', border: '1px solid #fecaca', padding: '10px 20px'} : {color: 'var(--subtle-ash)', background: '#f3f2f0', borderRadius: '15px', fontSize: '15px', border: '1px solid var(--soft-gray)', padding: '10px 20px'}}>
                  {isAdmin ? (<><LogOut size={16} className="mr-1.5"/>登出</>) : (<><Lock size={16} className="mr-1.5"/>管理員</>)}
                </button>
              </div>
            </div>
          </header>

          <main className="w-full relative text-center mx-auto py-0" style={{backgroundColor: 'var(--paper)', minHeight: 'calc(100vh - 88px)'}}>
            {/* v4.3.12: 連線狀態橫幅 — Firestore 快照來自快取（離線/弱網）時顯示，恢復連線自動消失 */}
            {isFromCache && (
              <div style={{background: '#fffbeb', borderBottom: '1px solid #fcd34d', color: '#92400e', padding: '10px 16px', fontWeight: 700, fontSize: '14px'}}>
                ⚠️ 連線不穩，資料可能不是最新（重新連線中…）
              </div>
            )}
            {/* v4.3.12: dbSetupError 可見化 — 原 state 從未被渲染；權限/缺索引/連線不可用分類顯示紅色錯誤條 */}
            {dbSetupError && (
              <div style={{background: '#fef2f2', borderBottom: '1px solid #fca5a5', color: '#b91c1c', padding: '10px 16px', fontWeight: 700, fontSize: '14px'}}>
                {dbSetupError === 'permission-denied' ? '🚫 資料庫權限錯誤，請聯絡管理員'
                  : dbSetupError === 'failed-precondition' ? '🚫 資料庫索引未建立，請聯絡管理員'
                  : '🚫 資料庫連線不可用，請稍後再試'}
              </div>
            )}
            <ModalDialog isOpen={dialog.isOpen} title={dialog.title} message={dialog.message} type={dialog.type} onConfirm={dialog.onConfirm} onCancel={dialog.onCancel} confirmText={dialog.confirmText} cancelText={dialog.cancelText} />
            <ChangelogModal isOpen={showChangelog} onClose={() => setShowChangelog(false)} />
            <PulseRecheckModal
              isOpen={showPulseRecheck}
              flowType={recheckFlowType}
              onClose={() => { setShowPulseRecheck(false); setRecheckTargetRecordId(null); }}
              onSubmit={handleRecheckSubmit}
              showAlert={showAlert}
            />
            {editRecordsPatientId && (
              <EditRecordsModal
                patientName={patients.find(p => p.id === editRecordsPatientId)?.name || ''}
                records={reportRecords.filter(r => r.patientId === editRecordsPatientId)}
                onClose={() => setEditRecordsPatientId(null)}
                dbAppId={dbAppId}
                workshopId={workshopId}
                showConfirm={showConfirm}
              />
            )}
            {/* v4.3.11: 服務對象垃圾桶 — 列出已軟刪除項目，可還原或永久刪除 */}
            {showTrash && (
              <TrashModal
                trashedPatients={trashedPatients}
                isTrashExpired={isTrashExpired}
                onClose={() => setShowTrash(false)}
                onRestore={restorePatient}
                onPurge={purgePermanently}
                showConfirm={showConfirm}
                showAlert={showAlert}
                handlePermError={handlePermError}
              />
            )}
            {/* v4.3.11: 刪除前打字確認姓名 modal — 走獨立 modal 因為 ModalDialog 沒 input 槽 */}
            {deleteConfirmPatient && (
              <DeleteConfirmModal
                patient={deleteConfirmPatient}
                onClose={() => setDeleteConfirmPatient(null)}
                onConfirm={async () => {
                  const id = deleteConfirmPatient.id;
                  setDeleteConfirmPatient(null);
                  await softDeletePatient(id);
                }}
              />
            )}
            {showSysAdmin && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
                  {/* 標題列 */}
                  <div className="flex items-center justify-between px-6 pt-6 pb-4 border-b border-slate-100">
                    <h2 className="text-xl font-extrabold text-slate-800 flex items-center gap-2">
                      <Settings size={20} className="text-purple-500"/>系統管理員面板
                    </h2>
                    <button onClick={() => { setShowSysAdmin(false); setSysAdminTab('workshops'); }} className="text-slate-400 hover:text-slate-600"><X size={24}/></button>
                  </div>
                  {/* 分頁 Tab */}
                  <div className="flex gap-1 px-6 pt-4">
                    <button
                      onClick={() => setSysAdminTab('workshops')}
                      className={`px-4 py-2 rounded-xl text-sm font-bold transition-colors ${sysAdminTab === 'workshops' ? 'bg-purple-100 text-purple-700' : 'text-slate-400 hover:bg-slate-100'}`}>
                      單位管理
                    </button>
                    <button
                      onClick={() => setSysAdminTab('passwords')}
                      className={`px-4 py-2 rounded-xl text-sm font-bold transition-colors ${sysAdminTab === 'passwords' ? 'bg-purple-100 text-purple-700' : 'text-slate-400 hover:bg-slate-100'}`}>
                      密碼管理
                    </button>
                    <button
                      onClick={() => setSysAdminTab('changelog')}
                      className={`px-4 py-2 rounded-xl text-sm font-bold transition-colors ${sysAdminTab === 'changelog' ? 'bg-purple-100 text-purple-700' : 'text-slate-400 hover:bg-slate-100'}`}>
                      版本紀錄
                    </button>
                  </div>
                  <div className="overflow-y-auto p-6 space-y-6">
                    {/* ── 單位管理 Tab ── */}
                    {sysAdminTab === 'workshops' && (<>
                      {/* 現有工坊清單 */}
                      <div>
                        <h3 className="text-sm font-extrabold text-slate-500 uppercase tracking-widest mb-3">工坊清單</h3>
                        {sysAdminLoading ? (
                          <div className="text-center py-4 text-slate-400"><Loader2 size={20} className="animate-spin inline mr-2"/>載入中...</div>
                        ) : (
                          <div className="space-y-2">
                            {sysAdminWorkshops.map(ws => (
                              <div key={ws.id} className="flex items-center justify-between bg-slate-50 rounded-2xl px-4 py-3">
                                <div className="flex items-center gap-3">
                                  <span className="text-2xl">{ws.icon}</span>
                                  <div>
                                    <p className="font-bold text-slate-800">{ws.name}</p>
                                    <p className="text-xs text-slate-400 font-mono">{ws.id}@health.local</p>
                                  </div>
                                </div>
                                <div className="flex items-center gap-2">
                                  <span className={`text-xs font-bold px-2 py-1 rounded-full ${ws.active !== false ? 'bg-green-100 text-green-600' : 'bg-slate-200 text-slate-400'}`}>
                                    {ws.active !== false ? '啟用中' : '已停用'}
                                  </span>
                                  <button
                                    onClick={() => showConfirm(ws.active !== false ? '停用工坊' : '啟用工坊', `確定要${ws.active !== false ? '停用' : '啟用'}「${ws.name}」嗎？`, () => handleToggleWorkshop(ws.id, ws.active !== false))}
                                    className={`text-xs font-bold px-3 py-1.5 rounded-xl transition-colors ${ws.active !== false ? 'bg-red-50 text-red-500 hover:bg-red-100' : 'bg-green-50 text-green-600 hover:bg-green-100'}`}>
                                    {ws.active !== false ? '停用' : '啟用'}
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                      {/* 新增工坊 */}
                      <div className="border-t border-slate-100 pt-6">
                        <h3 className="text-sm font-extrabold text-slate-500 uppercase tracking-widest mb-3">新增工坊</h3>
                        <div className="bg-blue-50 rounded-2xl p-4 space-y-3">
                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="text-xs font-bold text-blue-600 mb-1 block">工坊 ID（英文小寫）</label>
                              <input value={newWorkshop.id} onChange={e => setNewWorkshop(p => ({...p, id: e.target.value}))}
                                placeholder="e.g. new-workshop"
                                className="w-full px-3 py-2 border border-blue-200 rounded-xl text-sm outline-none focus:border-blue-400 bg-white font-mono"/>
                            </div>
                            <div>
                              <label className="text-xs font-bold text-blue-600 mb-1 block">工坊名稱</label>
                              <input value={newWorkshop.name} onChange={e => setNewWorkshop(p => ({...p, name: e.target.value}))}
                                placeholder="e.g. 新工坊"
                                className="w-full px-3 py-2 border border-blue-200 rounded-xl text-sm outline-none focus:border-blue-400 bg-white"/>
                            </div>
                          </div>
                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="text-xs font-bold text-blue-600 mb-1 block">圖示（Emoji）</label>
                              <input value={newWorkshop.icon} onChange={e => setNewWorkshop(p => ({...p, icon: e.target.value}))}
                                className="w-full px-3 py-2 border border-blue-200 rounded-xl text-sm outline-none focus:border-blue-400 bg-white"/>
                            </div>
                            <div>
                              <label className="text-xs font-bold text-blue-600 mb-1 block">初始登入密碼</label>
                              <input type="password" value={newWorkshop.pin} onChange={e => setNewWorkshop(p => ({...p, pin: e.target.value}))}
                                placeholder="設定初始密碼"
                                className="w-full px-3 py-2 border border-blue-200 rounded-xl text-sm outline-none focus:border-blue-400 bg-white"/>
                            </div>
                          </div>
                          <button onClick={handleAddWorkshop} disabled={sysAdminLoading}
                            className="w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-colors disabled:opacity-50">
                            {sysAdminLoading ? '處理中...' : '建立工坊'}
                          </button>
                        </div>
                      </div>
                    </>)}
                    {/* ── 密碼管理 Tab ── */}
                    {sysAdminTab === 'passwords' && (<>
                      <div>
                        <h3 className="text-sm font-extrabold text-slate-500 uppercase tracking-widest mb-3">工坊密碼管理</h3>
                        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-4 text-sm text-amber-800">
                          <p className="font-bold mb-1">⚠️ 前端密碼重設限制</p>
                          <p className="text-xs leading-relaxed">Firebase 前端 SDK 無法在不知道舊密碼的情況下重設其他帳號密碼。若需重設，請至 Firebase Console 手動操作。</p>
                          {/* 這裡的 YOUR_PROJECT_ID 要換成你的 Firebase 專案 ID，跟上面 FIREBASE_CONFIG 的 projectId 同一個值 */}
                          <a href="https://console.firebase.google.com/project/YOUR_PROJECT_ID/authentication/users" target="_blank" rel="noreferrer"
                            className="inline-block mt-2 text-xs font-bold text-amber-700 underline hover:text-amber-900">
                            開啟 Firebase Console &rarr;
                          </a>
                        </div>
                        {sysAdminLoading ? (
                          <div className="text-center py-4 text-slate-400"><Loader2 size={20} className="animate-spin inline mr-2"/>載入中...</div>
                        ) : (
                          <div className="space-y-3">
                            {sysAdminWorkshops.map(ws => (
                              <div key={ws.id} className="bg-slate-50 rounded-2xl px-4 py-3">
                                <div className="flex items-center gap-3 mb-3">
                                  <span className="text-xl">{ws.icon}</span>
                                  <div>
                                    <p className="font-bold text-slate-800 text-sm">{ws.name}</p>
                                    <p className="text-xs text-slate-400 font-mono">{ws.id}@health.local</p>
                                  </div>
                                </div>
                                {/* v4.3.14: 原「重設密碼」按鈕為假動作（前端 SDK 無法在不知舊密碼下重設他人帳號密碼），改為唯讀說明卡 */}
                                <p className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-500 leading-relaxed">
                                  密碼重設需至 Firebase Console &gt; Authentication 手動操作（前端無法重設他人帳號密碼）
                                </p>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </>)}
                    {/* ── 版本更新紀錄 Tab ── */}
                    {sysAdminTab === 'changelog' && (
                      <div className="space-y-4">
                        {CHANGELOG.map((entry, i) => (
                          <div key={entry.version} className={`rounded-2xl p-4 ${i === 0 ? 'bg-orange-50 border border-orange-100' : 'bg-slate-50'}`}>
                            <div className="flex items-center gap-2 mb-2">
                              <span className={`text-sm font-extrabold ${i === 0 ? 'text-orange-600' : 'text-slate-600'}`}>{entry.version}</span>
                              <span className="text-xs text-slate-400">{entry.date}</span>
                              {i === 0 && <span className="text-xs bg-orange-500 text-white px-2 py-0.5 rounded-full font-bold">最新</span>}
                            </div>
                            <ul className="space-y-1">
                              {entry.changes.map((change, j) => (
                                <li key={j} className="text-sm text-slate-600 flex gap-2 items-start">
                                  <span className="text-slate-300 mt-0.5 flex-shrink-0">•</span>
                                  <span className="flex-1 min-w-0 text-left">{change}</span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
            {view === 'list' && renderPatientList()}
            {view === 'add-patient' && (
              <div className="max-w-5xl mx-auto py-8 px-4 animate-in fade-in duration-300">
                <Card className="p-8">
                  <h2 className="text-3xl font-bold text-slate-800 mb-8 text-center flex items-center justify-center"><User className="mr-3 text-emerald-500" /> {editingPatientId ? '編輯服務對象資料' : '新增服務對象資料'}</h2>
                  <form onSubmit={handleAddPatientSubmit} className="space-y-8 text-left">
                    <div className="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
                      <div className="md:col-span-5 space-y-6">
                        <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100 flex flex-col items-center">
                          <div className={`w-24 h-24 rounded-full bg-white border-2 border-dashed border-slate-300 flex items-center justify-center overflow-hidden shadow-sm relative ${isCompressing ? 'opacity-50' : ''}`}>
                            {isCompressing ? <Loader2 className="w-8 h-8 text-emerald-500 animate-spin" /> : newPatient.photo ? <img src={newPatient.photo} className="w-full h-full object-cover" alt="Preview" /> : <User className="text-slate-300 w-10 h-10" />}
                          </div>
                          <input type="file" ref={fileInputRef} onChange={handlePhotoUpload} accept="image/*" className="hidden" />
                          <input type="file" ref={cameraInputRef} onChange={handlePhotoUpload} accept="image/*" capture="environment" className="hidden" />
                          
                          <div className="flex gap-3 mt-4">
                            <button type="button" onClick={() => !isCompressing && fileInputRef.current?.click()} disabled={isCompressing} className="px-4 py-2 bg-blue-50 text-blue-600 rounded-xl font-bold flex items-center shadow-sm hover:bg-blue-100 transition-colors text-sm disabled:opacity-50"><ImageIcon size={16} className="mr-1"/>上傳照片</button>
                            <button type="button" onClick={() => !isCompressing && cameraInputRef.current?.click()} disabled={isCompressing} className="px-4 py-2 bg-emerald-50 text-emerald-600 rounded-xl font-bold flex items-center shadow-sm hover:bg-emerald-100 transition-colors text-sm disabled:opacity-50"><Camera size={16} className="mr-1"/>拍照</button>
                          </div>
                        </div>
                        <div><label className="text-sm font-bold text-slate-500 block mb-2">服務對象姓名</label><input placeholder="請輸入姓名" className="w-full p-4 border rounded-2xl bg-slate-50 shadow-inner outline-none focus:ring-2 focus:ring-emerald-400 font-bold text-lg" value={newPatient.name} onChange={e => setNewPatient({...newPatient, name: e.target.value})} disabled={isSubmitting} /></div>
                        <div><label className="text-sm font-bold text-slate-500 block mb-2">生日</label><input type="date" className="w-full p-4 border rounded-2xl bg-slate-50 shadow-inner focus:ring-2 focus:ring-emerald-400 font-bold text-slate-700" value={newPatient.birthday} onChange={e => setNewPatient({...newPatient, birthday: e.target.value})} disabled={isSubmitting} /></div>
                        <div><label className="text-sm font-bold text-slate-500 block mb-2">性別</label><select className="w-full p-4 border rounded-2xl bg-slate-50 shadow-inner font-bold focus:ring-2 focus:ring-emerald-400 text-slate-700" value={newPatient.gender} onChange={e => setNewPatient({...newPatient, gender: e.target.value})} disabled={isSubmitting}><option value="男">男</option><option value="女">女</option></select></div>
                      </div>
                      <div className="md:col-span-7 h-full flex flex-col">
                        <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100 flex-1 flex flex-col h-full min-h-[300px]">
                          <div className="flex justify-between items-center mb-4">
                            <span className="text-base font-bold text-slate-700 flex items-center"><Pill className="w-5 h-5 mr-2 text-emerald-500"/> 用藥資訊 (選填)</span>
                            <button type="button" onClick={addMedication} disabled={isSubmitting} className="text-emerald-600 px-4 py-2 bg-white border border-emerald-100 rounded-xl text-sm font-bold shadow-sm transition-all active:scale-95 flex items-center"><Plus className="w-4 h-4 mr-1"/> 新增藥物</button>
                          </div>
                          <div className="space-y-4 overflow-y-auto pr-2 max-h-[350px]">
                            {(!newPatient.medications || newPatient.medications.length === 0) && (
                               <div className="flex flex-col items-center justify-center h-40 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400">
                                 <Pill className="w-8 h-8 mb-2 text-slate-300"/>
                                 <p className="font-bold">目前無用藥資訊</p>
                                 <p className="text-xs mt-1">點擊上方「新增藥物」從資料庫選取</p>
                               </div>
                            )}
                            {newPatient.medications?.map((med, index) => (
                              <div key={index} className="bg-white rounded-2xl border-2 border-slate-100 relative shadow-sm animate-in zoom-in duration-200 overflow-hidden">
                                {/* 藥名列 */}
                                <div className="flex items-center justify-between px-4 pt-3 pb-2 border-b border-slate-100">
                                  <span className="font-extrabold text-slate-800 text-base flex-1 truncate">
                                    {med.name || <span className="text-slate-300 font-normal italic">尚未選擇藥物</span>}
                                  </span>
                                  <div className="flex items-center gap-2 flex-shrink-0 ml-2">
                                    <button type="button" onClick={() => setDrugPickerIndex(index)} disabled={isSubmitting} className="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-xl text-xs font-bold hover:bg-blue-100 transition-colors flex items-center gap-1">
                                      <Search size={12}/>{med.name ? '換藥' : '選藥'}
                                    </button>
                                    <button type="button" onClick={() => removeMedication(index)} className="p-1.5 bg-red-50 text-red-400 rounded-lg hover:bg-red-100 hover:text-red-600 transition-colors"><Trash2 size={14}/></button>
                                  </div>
                                </div>
                                {/* 適應症 + 副作用（唯讀顯示，從資料庫帶入） */}
                                {(med.indication || med.sideEffects) && (
                                  <div className="px-4 py-2 space-y-1">
                                    {med.indication && <p className="text-xs text-slate-600"><span className="font-bold text-slate-400 mr-1">適應症</span>{med.indication}</p>}
                                    {med.sideEffects && <p className="text-xs text-red-500"><span className="font-bold text-red-400 mr-1">副作用</span>{med.sideEffects}</p>}
                                  </div>
                                )}
                                {/* 劑量 + 頻率（仍可手動輸入） */}
                                <div className="grid grid-cols-2 gap-3 px-4 pb-3 pt-2 border-t border-slate-50">
                                  <div>
                                    <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">劑量</label>
                                    <input placeholder="如: 5mg" className="w-full text-sm border-b-2 border-slate-100 py-1 outline-none focus:border-emerald-500" value={med.dosage} onChange={(e) => updateMedication(index, 'dosage', e.target.value)} disabled={isSubmitting} />
                                  </div>
                                  <div>
                                    <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">頻率</label>
                                    <input placeholder="如: 每日一次" className="w-full text-sm border-b-2 border-slate-100 py-1 outline-none focus:border-emerald-500" value={med.frequency} onChange={(e) => updateMedication(index, 'frequency', e.target.value)} disabled={isSubmitting} />
                                  </div>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    </div>
                    <div className="flex gap-6 pt-6 mt-6 border-t border-slate-100">
                      <button type="button" disabled={isSubmitting || isCompressing} onClick={() => { setView('list'); setEditingPatientId(null); setNewPatient({ name: '', birthday: '', gender: '男', photo: null, medications: [] }); }} className="flex-1 py-5 bg-slate-100 text-slate-500 font-bold text-lg rounded-2xl active:scale-95 transition-transform text-center hover:bg-slate-200 disabled:opacity-50">取消返回</button>
                      <button type="submit" disabled={isSubmitting || isCompressing} className={`flex-1 py-5 text-white rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition-transform text-center flex items-center justify-center ${(isSubmitting || isCompressing) ? 'bg-emerald-400 cursor-not-allowed' : 'bg-emerald-500 hover:bg-emerald-600'}`}>
                        {isSubmitting ? <><Loader2 className="animate-spin mr-2 w-6 h-6" />正在存入資料庫...</> : <><CheckCircle className="mr-2 w-6 h-6"/> {editingPatientId ? '確認儲存修改' : '確認新增服務對象'}</>}
                      </button>
                    </div>
                  </form>
                </Card>
              </div>
            )}
            {view === 'detail' && (
              <div className="max-w-4xl mx-auto px-4 py-8 animate-in fade-in duration-300">
                <div className="space-y-6 text-center">
                  <Card className="p-6 flex items-center justify-between shadow-lg shadow-slate-200/50">
                    <div className="flex items-center space-x-4"><button onClick={() => setView('list')} className="p-2 bg-slate-100 rounded-full hover:bg-slate-200 transition-colors"><ArrowLeft size={20} /></button><h2 className="text-3xl font-bold text-slate-800">{activePatient?.name}</h2></div>
                  </Card>
                  
                  {isQuarterEnd && (
                      <div className="bg-red-50 border-2 border-red-200 text-red-600 p-4 rounded-2xl font-bold flex items-center justify-center animate-pulse">
                          <AlertCircle className="w-6 h-6 mr-2" /> ⚠️ 本週為每月身體量測週，請務必進行身體量測！
                      </div>
                  )}

                  <div className="grid grid-cols-2 gap-4 md:gap-6 text-center">
                    {(() => {
                      // 判斷今日每日量測是否已完成（用於量測週的按鈕鎖定）
                      const todayStr = currentDate.toDateString();
                      const todayRecs = records.filter(r => r.patientId === selectedPatientId && new Date(r.timestamp).toDateString() === todayStr);
                      const latestTodayRec = todayRecs.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).find(r => r.recordType !== 'weight') ?? null;
                      const isDailyDone = latestTodayRec && (latestTodayRec.status === 'completed' || latestTodayRec.status === 'pending_afternoon_bp' || latestTodayRec.status === 'pending_afternoon_emotion');
                      // 判斷本月身體量測是否已完成（整個月只需量一次）
                      const currentYearMonth = currentDate.toISOString().slice(0, 7); // 例如 "2026-03"
                      const thisMonthWeightRec = records.find(r =>
                          r.patientId === selectedPatientId &&
                          r.recordType === 'weight' &&
                          r.status === 'completed' &&
                          r.timestamp?.startsWith(currentYearMonth)
                      );
                      const isWeightDone = !!thisMonthWeightRec;
                      // 量測週且今日每日量測已完成 → 鎖定每日量測相關按鈕，只開放身體量測
                      const weightOnlyMode = isQuarterEnd && isDailyDone && !isAdmin;
                      return (
                        <>
                          <button onClick={weightOnlyMode ? null : startWizard} className={`p-6 rounded-3xl font-bold text-xl md:text-2xl shadow-lg transform transition-all text-center flex flex-col items-center justify-center ${weightOnlyMode ? 'bg-slate-200 text-slate-400 cursor-not-allowed opacity-60' : 'bg-gradient-to-br from-orange-400 to-rose-400 text-white active:scale-95 shadow-orange-200'}`}>
                              <Activity className="w-8 h-8 mb-2"/>每日量測
                              {weightOnlyMode && <span className="text-sm font-normal mt-2 block">今日已完成</span>}
                          </button>
                          <button onClick={(isQuarterEnd && !isWeightDone) ? startWeightInput : null} className={`p-6 rounded-3xl font-bold text-xl md:text-2xl shadow-lg transform transition-all text-center flex flex-col items-center justify-center ${!isQuarterEnd ? 'bg-slate-200 text-slate-400 cursor-not-allowed opacity-80' : isWeightDone ? 'bg-emerald-500 text-white cursor-not-allowed opacity-80' : 'bg-blue-500 text-white active:scale-95 hover:bg-blue-600 ring-4 ring-blue-200'}`}>
                              <Scale className="w-8 h-8 mb-2"/>身體量測
                              {!isQuarterEnd && <span className="text-sm font-normal mt-2 block">非量測週鎖定中</span>}
                              {isQuarterEnd && isWeightDone && <span className="text-sm font-normal mt-2 block">本月已完成 ✓</span>}
                          </button>
                          <button onClick={weightOnlyMode ? null : () => handleLeave(selectedPatientId)} className={`p-6 rounded-3xl font-bold text-xl md:text-2xl shadow-lg transform transition-all flex flex-col items-center justify-center ${weightOnlyMode ? 'bg-slate-200 text-slate-400 cursor-not-allowed opacity-60' : 'bg-slate-500 text-white active:scale-95'}`}>
                              <CalendarOff className="w-8 h-8 mb-2"/>今日請假
                          </button>
                          <button onClick={weightOnlyMode ? null : () => handleEmotionIssue(selectedPatientId)} className={`p-6 rounded-3xl font-bold text-xl md:text-2xl shadow-lg transform transition-all flex flex-col items-center justify-center ${weightOnlyMode ? 'bg-slate-200 text-slate-400 cursor-not-allowed opacity-60' : 'bg-purple-500 text-white active:scale-95'}`}>
                              <Frown className="w-8 h-8 mb-2"/>情緒起伏不適合
                          </button>
                        </>
                      );
                    })()}
                  </div>

                </div>
              </div>
            )}
            {view === 'wizard' && renderWizard()}
            {view === 'report' && renderReport()}
          </main>

          {/* 選藥視窗 */}
          <DrugPickerModal
            isOpen={drugPickerIndex !== null}
            onClose={() => setDrugPickerIndex(null)}
            onSelect={handleDrugSelected}
            onAddNewDrug={handleAddDrugFromPicker}
            onUpdateDrug={handleUpdateDrugFromPicker}
            onDeleteDrug={handleDeleteDrugFromPicker}
            medicationsDB={medicationsDB}
            isAdmin={isAdmin}
          />

          {showAdminLogin && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-in zoom-in duration-200 text-center"><Card className="w-full max-w-sm p-8 shadow-2xl text-center"><div className="text-center mb-6"><div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4"><KeyRound size={32} /></div><h2 className="text-2xl font-bold text-slate-800 text-center">管理權限認證</h2></div><form onSubmit={submitAdminLogin} className="space-y-4 text-center"><input type="password" autoFocus placeholder="請輸入管理密碼" className="w-full p-4 border-2 border-slate-100 rounded-2xl text-center text-xl tracking-widest focus:border-blue-500 outline-none font-bold" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} /><button type="submit" className="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg active:scale-95 transition-all text-center">登入</button><button type="button" onClick={() => setShowAdminLogin(false)} className="w-full py-2 text-slate-400 font-bold text-center text-sm">取消</button></form></Card></div>
          )}

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <MainApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
